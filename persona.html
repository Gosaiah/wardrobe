<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alter · Persona</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20C33 20 29 38 31 56C33 74 42 84 50 84C58 84 67 74 69 56C71 38 67 20 50 20Z' fill='%23e2d3b4'/></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e4df;
    --muted: #6b6b6b;
    --accent: #e2d3b4;
    --accent2: #c9b98f;
    --white: #f5f2ee;
  }
  html { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 14px; line-height: 1.5; }
  body { margin: 0; padding: 0; }

  /* ── HERO ── */
  .hero {
    position: relative;
    height: 90vh;
    min-height: 500px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }
  .hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    filter: brightness(0.45);
  }
  .hero-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      transparent 0%,
      transparent 32%,
      var(--bg) 100%
    );
  }
  .hero-content {
    position: relative;
    z-index: 2;
    padding: 0 48px 56px;
    width: 100%;
  }
  .hero-number {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .hero-name {
    font-size: clamp(52px, 8vw, 100px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 0.92;
    color: var(--white);
    margin-bottom: 16px;
  }
  .hero-alias {
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: 0.04em;
  }
  .hero-tagline {
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hero-badges {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .hero-badge {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent2);
    padding: 4px 10px;
    border-radius:6px;
  }

  /* ── PAGE CONTENT ── */
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 48px 120px;
  }

  /* ── SECTION ── */
  .section { margin-top: 80px; }
  .section-label {
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    border-left: 2px solid var(--accent);
    padding-left: 12px;
    margin-bottom: 32px;
  }

  /* ── LORE ── */
  .lore-text {
    font-size: 18px;
    line-height: 1.75;
    color: var(--text);
    max-width: 720px;
    font-weight: 300;
    letter-spacing: 0.01em;
  }
  .lore-text em { color: var(--accent); font-style: normal; font-weight: 400; }

  /* ── CLASSIFICATION ── */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-top: 48px;
  }
  .class-cell {
    background: var(--surface);
    padding: 28px 24px;
  }
  .class-key {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .class-val {
    font-size: 20px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: -0.01em;
  }

  /* ── STATS ── */
  .stats-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 48px;
    align-items: center;
  }
  .stat-bars { display: flex; flex-direction: column; gap: 16px; }
  .stat-row { display: flex; align-items: center; gap: 14px; }
  .stat-name {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    min-width: 80px;
  }
  .stat-track {
    flex: 1;
    height: 3px;
    background: var(--surface2);
    border-radius:6px;
    overflow: hidden;
  }
  .stat-fill {
    height: 100%;
    background: var(--accent);
    border-radius:6px;
    transition: width 0.8s ease;
  }
  .stat-val {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    min-width: 16px;
    text-align: right;
  }

  /* ── SPECIALIZATIONS ── */
  .specs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .spec-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px 28px;
    transition: border-color 0.2s;
    cursor: default;
  }
  .spec-card:hover { border-color: var(--accent2); }
  .spec-number {
    font-size: 9px;
    letter-spacing: 0.22em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .spec-name {
    font-size: 22px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .spec-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.75;
    margin-bottom: 20px;
  }
  .spec-anchor-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 4px;
  }
  .spec-anchor {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  /* ── MOVES ── */
  .moves-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }
  .move-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px 28px 24px;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .move-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--border);
  }
  .move-card.ultimate {
    border-color: var(--accent2);
    background: linear-gradient(135deg, #1a1714 0%, var(--surface) 60%);
  }
  .move-card.ultimate::before {
    background: linear-gradient(to right, var(--accent), transparent);
  }
  .move-card:hover { border-color: var(--accent2); }
  .move-card.ultimate:hover { border-color: var(--accent); }
  .move-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .move-type {
    font-size: 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius:6px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .move-type.passive  { color: var(--passive); background: var(--passive-tint); border: 1px solid var(--passive-border); }
  .move-type.active   { color: var(--active); background: var(--active-tint); border: 1px solid var(--active-border); }
  .move-type.ultimate { color: var(--accent); background: rgba(226, 211, 180,0.12); border: 1px solid var(--accent2); }
  .move-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .move-card.ultimate .move-name { color: var(--accent); }
  .move-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.75;
    margin-bottom: 16px;
    font-style: italic;
  }
  .move-effect-label {
    font-size: 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 5px;
  }
  .move-effect {
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
  }
  .move-card.ultimate .move-effect { color: var(--accent); }

  /* ── PIECES ── */
  .pieces-list { display: flex; flex-direction: column; gap: 2px; }
  /* Signature Kit */
  .sig-kit-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .sig-count { font-size:10px; letter-spacing:.1em; background:var(--surface2); color:var(--muted); border:1px solid var(--border); padding:2px 9px; border-radius:10px; font-weight:700; }
  .sig-count.complete { background:var(--accent); color:#111; border-color:var(--accent); }
  .sig-kit-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .sig-slot { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .sig-thumb { aspect-ratio:1/1; background:var(--surface2); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:24px; }
  .sig-thumb img { width:100%; height:100%; object-fit:cover; object-position:top center; }
  .sig-slot-body { padding:9px 11px; }
  .sig-label { font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .sig-name { font-size:11px; color:var(--text); margin-top:3px; line-height:1.3; }
  .sig-gap { border-style:dashed; }
  .sig-gap .sig-thumb { opacity:.35; }
  .sig-gap .sig-name { color:var(--accent); }
  .sig-spider { display:flex; justify-content:center; padding:4px 4px 10px; border-top:1px solid var(--border); margin-top:4px; }
  .sig-spider svg { max-width:100%; height:auto; }
  @media(max-width:600px){ .sig-kit-row{ grid-template-columns:repeat(2,1fr);} }
  /* To Consider — shop picks */
  .picks-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .pick-card { display:flex; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; text-decoration:none; color:inherit; transition:border-color .15s; }
  .pick-card:hover { border-color:var(--accent2); }
  .pick-thumb { width:74px; min-width:74px; background:var(--surface2); position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:20px; }
  .pick-thumb img { width:100%; height:100%; object-fit:cover; object-position:center; }
  .pick-prio { position:absolute; bottom:5px; left:5px; font-size:7px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; padding:2px 5px; border-radius:5px; }
  .prio-list { background:var(--accent); color:#111; }
  .prio-high { background:rgba(217,160,102,.2); color:#d9a066; }
  .prio-medium { background:rgba(125,140,163,.18); color:#9aa8bd; }
  .prio-low { background:var(--surface2); color:var(--muted); }
  .pick-body { padding:9px 10px 9px 0; min-width:0; }
  .pick-brand { font-size:8px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .pick-name { font-size:11px; color:var(--text); margin:2px 0; line-height:1.25; }
  .pick-price { font-size:10px; color:var(--accent); margin-bottom:4px; }
  .pick-why { font-size:9.5px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .pick-empty { color:var(--muted); font-size:12px; }
  .pick-empty a { color:var(--accent); text-decoration:none; }
  .piece-row {
    background: var(--surface);
    border: 1px solid var(--border);
    display: grid;
    grid-template-columns: 56px 90px 1fr;
    align-items: center;
    gap: 0;
    transition: border-color 0.2s;
    overflow: hidden;
  }
  .piece-row:hover { border-color: var(--accent2); }
  .piece-thumb {
    width: 56px;
    height: 72px;
    object-fit: cover;
    object-position: top center;
    display: block;
    flex-shrink: 0;
    filter: brightness(0.9);
  }
  .piece-role-col {
    padding: 0 16px;
    border-right: 1px solid var(--border);
    height: 100%;
    display: flex;
    align-items: center;
  }
  .piece-role {
    font-size: 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .piece-info {
    padding: 0 24px;
  }
  .piece-name {
    font-size: 13px;
    color: var(--white);
    font-weight: 500;
    margin-bottom: 3px;
  }
  .piece-brand {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── GALLERY ── */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .gallery-item {
    position: relative;
    aspect-ratio: 3/4;
    overflow: hidden;
    background: var(--surface2);
    cursor: pointer;
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    transition: transform 0.4s ease, filter 0.4s ease;
    filter: brightness(0.85);
  }
  .gallery-item:hover img { transform: scale(1.03); filter: brightness(1); }
  .gallery-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 32px 16px 16px;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.8));
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }

  /* ── OTHER PERSONAS ── */
  .personas-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    margin-top: 32px;
  }
  .persona-card {
    position: relative;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: var(--surface2);
    text-decoration: none;
    display: block;
  }
  .persona-card img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    filter: brightness(0.35);
    transition: filter 0.3s;
  }
  .persona-card:hover img { filter: brightness(0.55); }
  .persona-card.current img { filter: brightness(0.2); }
  .persona-card-info {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 14px 14px;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.85));
  }
  .persona-card-num {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .persona-card-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
  }
  .persona-card.current .persona-card-name { color: var(--muted); }

  /* ── DIVIDER ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 64px 0 0; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .hero-content { padding: 0 24px 40px; }
    .page { padding: 0 24px 80px; }
    .specs-grid { grid-template-columns: 1fr; }
    .moves-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr; }
    .personas-row { grid-template-columns: repeat(2, 1fr); }
    .class-grid { grid-template-columns: 1fr; }
  }
  /* Gallery → clickable outfit cards with spiders */
  .gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .gallery-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; transition:border-color .2s ease; }
  .gallery-card:hover { border-color:var(--accent); }
  .gallery-photo { aspect-ratio:3/4; overflow:hidden; background:var(--surface2); }
  .gallery-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; filter:brightness(.9); transition:transform .4s ease, filter .4s ease; }
  .gallery-card:hover .gallery-photo img { transform:scale(1.03); filter:brightness(1); }
  .gallery-card-body { padding:10px 12px 6px; }
  .gallery-card-num { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .gallery-card-name { font-size:12px; color:var(--text); margin-top:2px; line-height:1.3; min-height:2.2em; }
  .gallery-card-spider { display:flex; justify-content:center; margin-top:2px; }
  .gallery-card-spider svg { max-width:100%; height:auto; }
  /* Outfit detail modal — SAME classes/markup as the outfits page popup */
  .item-detail-overlay { position:fixed; inset:0; z-index:1200; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; }
  .item-detail-panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; width:clamp(320px,96vw,1100px); max-height:92vh; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .item-detail-inner { display:flex; overflow:hidden; flex:1; min-height:0; align-items:stretch; }
  .item-detail-close { position:absolute; top:14px; right:16px; background:none; border:1px solid var(--border); color:var(--muted); cursor:pointer; padding:4px 10px; border-radius:10px; font-size:0.9rem; z-index:10; transition:color .2s,border-color .2s; font-family:inherit; }
  .item-detail-close:hover { color:var(--white); border-color:var(--white); }
  .item-detail-photo-col { width:40%; flex-shrink:0; background:var(--surface2); border-right:1px solid var(--border); overflow:hidden; align-self:stretch; }
  .item-detail-photo { width:100%; height:100%; }
  .item-detail-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .item-detail-info-col { flex:1; overflow-y:auto; padding:clamp(16px,3vw,28px); min-width:0; }
  .lb-outfit-num { font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .lb-outfit-name { font-size:18px; font-weight:600; color:var(--white); line-height:1.2; margin-bottom:4px; }
  .lb-outfit-vibe { font-size:11px; color:var(--accent); font-style:italic; margin-bottom:20px; }
  .lb-pieces-title { font-size:8px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:6px; }
  .lb-piece-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .lb-piece-thumb { width:38px; height:48px; flex-shrink:0; border-radius:6px; overflow:hidden; background:var(--surface2); border:1px solid var(--border); }
  .lb-piece-thumb img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .lb-piece-info { flex:1; min-width:0; }
  .lb-piece-role { font-size:8px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:1px; }
  .lb-piece-name { font-size:11px; color:var(--text); line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-piece-brand { font-size:8px; color:var(--accent2); margin-top:1px; }
  @media(max-width:600px){
    .gallery{ grid-template-columns:repeat(2,1fr);}
    .item-detail-panel{ width:100%; max-height:100vh; height:100vh; border-radius:0; }
    .item-detail-inner{ flex-direction:column; }
    .item-detail-photo-col{ width:100%; height:280px; border-right:none; border-bottom:1px solid var(--border); }
    .item-detail-info-col{ padding:20px 18px; }
  }
</style>
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="alter-theme.css">
<script>(function(){try{var t=localStorage.getItem('alter-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>

<script src="nav.js"></script>
<script src="data.js"></script>

<div id="persona-root"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const PERSONAS = {
  'overlord': {
    id: 'overlord',
    alias: 'Zayder',
    number: 'CHARACTER 01',
    name: 'Overlord',
    tagline: 'Ancient. Already decided.',
    badges: ['Core Identity', 'Any Environment', 'Maximum Edge'],
    hero: 'outfits/outfit_01.jpg',
    lore: 'Ancient. Has been in every room worth being in and still walks into this one like it owes him something. The all-black isn\'t intimidation — it\'s verdict. You feel judged before he speaks, decided before he moves. Whatever is about to happen, he already knows. The clothes are the last warning.',
    classification: [
      { key: 'Occasion', val: 'Any Environment' },
      { key: 'Intensity', val: 'Maximum' },
      { key: 'Frequency', val: 'Core Identity' }
    ],
    stats: {drama:4.0, structure:3.5, skin:1.0, edge:3.5, formality:2.0},
    spiderColor: '#e2d3b4',
    specializations: [
      {
        name: 'Monolith',
        desc: 'Single dark tone pushed to its absolute limit. Maximum structure, zero distraction. The look that needs no explanation in any room.',
        anchor: 'All-black MINOAR coat + base layer + tall boots'
      },
      {
        name: 'Shadow Layer',
        desc: 'Layered darks playing depth without relying on pattern. Texture creates all contrast when color refuses to.',
        anchor: 'Hexa coat over sleeveless top over jogger'
      },
      {
        name: 'Full MINOAR',
        desc: 'Every piece from the same world. Silhouette complete from boots upward. Only activated when the stakes match.',
        anchor: 'Full MINOAR top-to-toe — skirt trouser or wide leg'
      }
    ],

// ── SPIDER CHART ─────────────────────────────────────────────────────────────
// drawSpider() consolidated into data.js — shared 8-spoke renderer

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'overlord';
  const p = PERSONAS[id] || PERSONAS['overlord'];

  document.title = `Alter · ${p.name.replace('\n', ' ')}`;

  const heroName = p.name.replace('\n', '<br>');

  const statsHtml = Object.entries(p.stats).map(([k, v]) =>
    `<div class="stat-row">
      <span class="stat-name">${k.charAt(0).toUpperCase()+k.slice(1)}</span>
      <div class="stat-track"><div class="stat-fill" style="width:${v/5*100}%"></div></div>
      <span class="stat-val">${v.toFixed(1)}</span>
    </div>`
  ).join('');

  const specsHtml = p.specializations.map((s, i) =>
    `<div class="spec-card">
      <div class="spec-number">SPEC 0${i+1}</div>
      <div class="spec-name">${s.name}</div>
      <div class="spec-desc">${s.desc}</div>
      <div class="spec-anchor-label">Signature Pieces</div>
      <div class="spec-anchor">${s.anchor}</div>
    </div>`
  ).join('');

  const movesHtml = p.moves.map(m =>
    `<div class="move-card${m.type === 'ultimate' ? ' ultimate' : ''}">
      <div class="move-header">
        <span class="move-type ${m.type}">${m.type}</span>
        <span class="move-name">${m.name}</span>
      </div>
      <div class="move-desc">${m.desc}</div>
      <div class="move-effect-label">Effect</div>
      <div class="move-effect">${m.effect}</div>
    </div>`
  ).join('');

  const piecesHtml = p.pieces.map(pc =>
    `<div class="piece-row">
      <img class="piece-thumb" src="${pc.img}" alt="${pc.name}" loading="lazy">
      <div class="piece-role-col"><span class="piece-role">${pc.role}</span></div>
      <div class="piece-info">
        <div class="piece-name">${pc.name}</div>
        <div class="piece-brand">${pc.brand}</div>
      </div>
    </div>`
  ).join('');

  const galleryHtml = p.outfits.map(o => {
    const oid = parseInt(o.num, 10);
    const od = (typeof OUTFITS_DEFAULT !== 'undefined') ? OUTFITS_DEFAULT.find(x => x.id === oid) : null;
    return (od && typeof outfitCardHtml === 'function') ? outfitCardHtml(od, { photo: o.img }) : '';
  }).join('');

  const personasHtml = ALL_ORDER.map(pid => {
    const other = PERSONAS[pid];
    const isCurrent = pid === id;
    return `<a href="persona.html?id=${pid}" class="persona-card${isCurrent ? ' current' : ''}">
      <img src="${other.hero}" alt="${other.name}" loading="lazy">
      <div class="persona-card-info">
        <div class="persona-card-num">${other.number}</div>
        <div class="persona-card-name">${other.name.replace('\n', ' ')}</div>
      </div>
    </a>`;
  }).join('');

  const badgesHtml = p.badges.map(b => `<span class="hero-badge">${b}</span>`).join('');
  const spiderSvg = drawSpider((typeof PERSONA_TARGETS!=='undefined' && PERSONA_TARGETS[id]) || p.stats, 220, p.spiderColor, id);

  // Signature Kit — top / bottom / shoe / accessory, resolved live from data.js SIGNATURES
  const SIG_SLOTS = [['top','Top'],['bottom','Bottom'],['shoe','Shoe'],['accessory','Accessory']];
  const sig = (typeof SIGNATURES !== 'undefined' && SIGNATURES[id]) ? SIGNATURES[id] : {};
  let sigFilled = 0;
  const sigCards = SIG_SLOTS.map(([slot, label]) => {
    const iid = sig[slot];
    const it = (iid && typeof itemById === 'function') ? itemById(iid) : null;
    if (it) { sigFilled++; return (typeof itemCardHtml === 'function') ? itemCardHtml(it, { persona: id, roleLabel: label }) : ''; }
    return `<div class="mgr-item sig-gap"><div class="mgr-item-role">${label}</div><div class="mgr-item-img"><div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:26px;color:var(--muted)">&#43;</div></div><div class="mgr-item-cv"><div class="mgr-item-cv-name" style="color:var(--accent)">Gap &mdash; shop target</div></div></div>`;
  }).join('');
  const kitHtml = `<div class="sig-kit-head"><div class="section-label" style="margin:0">Signature Kit</div><span class="sig-count${sigFilled === 4 ? ' complete' : ''}">${sigFilled}/4</span></div><div class="mgr-items card-view" style="grid-template-columns:repeat(4,1fr)">${sigCards}</div>`;

  // To Consider — shop picks for this persona, sorted by priority
  const PRANK = { list:0, high:1, medium:2, low:3 };
  const PPLABEL = { list:"On List", high:"Priority", medium:"Consider", low:"Maybe" };
  const picks = ((typeof SHOP !== 'undefined') ? SHOP.filter(s => s.persona === id) : [])
    .sort((a,b) => (PRANK[a.priority] ?? 9) - (PRANK[b.priority] ?? 9));
  const picksHtml = picks.length ? picks.map(it => {
    const pimg = it.img ? `<img src="${it.img}" alt="${it.name}" loading="lazy">` : '&#9672;';
    return `<a class="pick-card" href="${it.url}" target="_blank" rel="noopener">
      <div class="pick-thumb">${pimg}<span class="pick-prio prio-${it.priority}">${PPLABEL[it.priority]||''}</span></div>
      <div class="pick-body"><div class="pick-brand">${it.brand}</div><div class="pick-name">${it.name}</div><div class="pick-price">${it.price}</div><div class="pick-why">${it.why}</div></div>
    </a>`;
  }).join('') : `<div class="pick-empty">No picks yet for this character. <a href="shop.html">Browse the shop &rarr;</a></div>`;

  document.getElementById('persona-root').innerHTML = `
    <!-- HERO -->
    <div class="hero">
      <img class="hero-img" src="${p.hero}" alt="${p.name}">
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-number">${p.number}</div>
        <h1 class="hero-name">${heroName}</h1>
        ${p.alias ? `<div class="hero-alias">aka ${p.alias}</div>` : ''}
        <div class="hero-tagline">${p.tagline}</div>
        <div class="hero-badges">${badgesHtml}</div>
      </div>
    </div>

    <div class="page">

      <!-- LORE -->
      <div class="section">
        <div class="section-label">Background</div>
        <p class="lore-text">${p.lore}</p>
        <div class="class-grid">
          ${p.classification.map(c => `<div class="class-cell"><div class="class-key">${c.key}</div><div class="class-val">${c.val}</div></div>`).join('')}
        </div>
      </div>

      <!-- STATS -->
      <div class="section">
        <div class="section-label">Style Stats</div>
        <div class="stats-grid">
          <div>${spiderSvg}</div>
          <div class="stat-bars">${statsHtml}</div>
        </div>
      </div>

      <!-- SPECIALIZATIONS -->
      <div class="section">
        <div class="section-label">Specializations</div>
        <div class="specs-grid">${specsHtml}</div>
      </div>

      <!-- SIGNATURE MOVES -->
      <div class="section">
        <div class="section-label">Signature Moves</div>
        <div class="moves-grid">${movesHtml}</div>
      </div>

      <!-- SIGNATURE KIT -->
      <div class="section">
        ${kitHtml}
      </div>

      <!-- TO CONSIDER (shop picks) -->
      <div class="section">
        <div class="sig-kit-head"><div class="section-label" style="margin:0">To Consider</div><a href="shop.html" style="font-size:10px;color:var(--muted);text-decoration:none;letter-spacing:.1em;text-transform:uppercase">Shop all &rarr;</a></div>
        <div class="picks-row">${picksHtml}</div>
      </div>

      <!-- GALLERY -->
      <div class="section">
        <div class="section-label">Gallery</div>
        <div class="outfits-grid card-view">${galleryHtml}</div>
      </div>

      <!-- OTHER PERSONAS -->
      <hr class="divider">
      <div class="section">
        <div class="section-label">Other Personas</div>
        <div class="personas-row">${personasHtml}</div>
      </div>

    </div>
  `;
}

render();

  const piecesHtml = (od.pieces || []).map(function(p){
    var pim = (typeof pieceImg === 'function') ? pieceImg(p) : '';
    var pb = (typeof BRANDS !== 'undefined' && BRANDS[p.brand] && BRANDS[p.brand].label) || p.brand;
    return "<div class='lb-piece-row'><div class='lb-piece-thumb'>" + (pim ? "<img src='" + pim + "' alt='" + p.name + "'>" : "") + "</div>" +
      "<div class='lb-piece-info'><div class='lb-piece-role'>" + p.role + "</div><div class='lb-piece-name'>" + p.name + "</div><div class='lb-piece-brand'>" + pb + "</div></div></div>";
  }).join("");
  const st = (typeof effectiveOutfitStats === 'function') ? effectiveOutfitStats(od) : null;
  document.getElementById('photo-lightbox-info').innerHTML =
    "<div class='lb-outfit-num'>No. " + String(od.id).padStart(2,'0') + (od.source === 'detected' ? " &middot; Auto-detected" : "") + "</div>" +
    "<div class='lb-outfit-name'>" + od.name + "</div>" +
    "<div style='display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px'>" +
      "<div class='lb-outfit-vibe' style='margin-bottom:0'>" + (od.vibe || "") + "</div>" +
      (od.persona ? "<span style='background:var(--accent);color:#111;font-size:8px;padding:2px 6px;border-radius:4px;letter-spacing:0.06em;font-weight:700;text-transform:uppercase'>" + (PLAB_MODAL[od.persona] || od.persona) + "</span>" : "") +
    "</div>" +
    (typeof outfitStatsCompareHtml === 'function' ? outfitStatsCompareHtml(od) : "") +
    "<div class='lb-pieces-title'>Pieces</div>" + piecesHtml;
  document.getElementById('photo-lightbox').style.display = 'flex';
}
function closeOutfitModal(){ var m = document.getElementById('photo-lightbox'); if (m) m.style.display = 'none'; }

// ── Item detail popup — shared builders (same as the clothing page item popup) ──
function openItemModal(item){
  if (!item) return;
  document.getElementById('item-detail-photo').innerHTML = (typeof itemDetailPhotoHtml === 'function') ? itemDetailPhotoHtml(item) : '';
  document.getElementById('item-detail-info').innerHTML = (typeof itemDetailInfoHtml === 'function') ? itemDetailInfoHtml(item, {}) : '';
  document.getElementById('item-detail-overlay').style.display = 'flex';
}
function closeItemModal(){ var m = document.getElementById('item-detail-overlay'); if (m) m.style.display = 'none'; }
function _resolveItem(name, brand){ return (typeof itemForPiece === 'function') ? itemForPiece({ name: name, brand: brand }) : null; }

document.addEventListener('click', function(e){
  const chip = e.target.closest && e.target.closest('[data-outfit-id]');
  if (chip) { const id = parseInt(chip.dataset.outfitId, 10); closeItemModal(); openOutfitModal(id, chip.dataset.outfitPhoto || ("outfits/outfit_" + String(id).padStart(2,'0') + ".jpg")); return; }
  const pc = e.target.closest && e.target.closest('.pair-card');
  if (pc) { const it = _resolveItem(pc.dataset.name, pc.dataset.brand); if (it) openItemModal(it); return; }
  const mi = e.target.closest && e.target.closest('.mgr-item');
  if (mi && mi.dataset.id) { const it = (typeof itemById === 'function') ? itemById(mi.dataset.id) : null; if (it) openItemModal(it); return; }
  const oc = e.target.closest && e.target.closest('.outfit-card');
  if (oc) { openOutfitModal(parseInt(oc.dataset.id, 10), oc.dataset.img); return; }
  if (e.target.id === 'photo-lightbox-close' || e.target.id === 'photo-lightbox') closeOutfitModal();
  if (e.target.id === 'item-detail-close' || e.target.id === 'item-detail-overlay') closeItemModal();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeOutfitModal(); closeItemModal(); } });
</script>

<!-- Outfit detail modal — identical markup to the outfits page popup -->
<div class="item-detail-overlay" id="photo-lightbox" style="display:none">
  <div class="item-detail-panel">
    <button class="item-detail-close" id="photo-lightbox-close">&#x2715;</button>
    <div class="item-detail-inner">
      <div class="item-detail-photo-col">
        <div class="item-detail-photo"><img id="photo-lightbox-img" src="" alt="" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block"></div>
      </div>
      <div class="item-detail-info-col" id="photo-lightbox-info"></div>
    </div>
  </div>
</div>

<!-- Item detail modal — identical markup to the clothing page item popup -->
<div class="item-detail-overlay" id="item-detail-overlay" style="display:none">
  <div class="item-detail-panel">
    <button class="item-detail-close" id="item-detail-close">&#x2715;</button>
    <div class="item-detail-inner">
      <div class="item-detail-photo-col"><div class="item-detail-photo" id="item-detail-photo"></div></div>
      <div class="item-detail-info-col" id="item-detail-info"></div>
    </div>
  </div>
</div>
