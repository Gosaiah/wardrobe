<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alter — Outfit Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20C33 20 29 38 31 56C33 74 42 84 50 84C58 84 67 74 69 56C71 38 67 20 50 20Z' fill='%23e2d3b4'/></svg>">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e4df;
    --muted: #6b6b6b;
    --accent: #e2d3b4;
    --accent2: #c9b98f;
    --white: #f5f2ee;
    --tag-orttu: #1f2937;
    --tag-minoar: #1a1a2e;
    --tag-ryvk: #2d1b1b;
    --tag-frkm: #1a1510;
    --tag-yasar: #0f0f0f;
    --tag-teamm8: #1a1a2e;
    --tag-arahant: #1a0e10;
    --tag-gasper: #14100a;
    --tag-koe: #1c1a16;
    --green: var(--success, #2e7d32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: #000;
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .header-left h1 {
    font-size: 13px;
    letter-spacing: 0.18em;
    font-weight: 600;
    color: var(--white);
    text-transform: uppercase;
  }
  .header-left p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }
  .header-right {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius:8px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(226, 211, 180,0.06);
  }

  /* ── MAIN LAYOUT ── */
  .container { display: flex; height: calc(100vh - 69px); }

  /* ── WARDROBE SIDEBAR ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding-bottom: 32px;
  }
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #111;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  .sidebar-tab {
    flex: 1;
    padding: 9px 4px;
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sidebar-section {
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section-header {
    padding: 12px 16px 10px;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    background: #111;
    position: sticky;
    top: 37px;
    z-index: 2;
  }
  .wardrobe-item {
    padding: 6px 12px;
    border-bottom: 1px solid rgba(42,42,42,0.5);
    cursor: grab;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: background 0.1s;
    user-select: none;
  }
  .wardrobe-item:hover { background: var(--surface2); }
  .wardrobe-item:active { cursor: grabbing; }
  .item-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .item-thumb {
    width: 32px;
    height: 40px;
    flex-shrink: 0;
    border-radius:6px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .item-thumb-empty {
    width: 100%;
    height: 100%;
    background: var(--surface2);
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .item-meta {
    font-size: 9px;
    color: var(--muted);
    margin-top: 1px;
  }
  .item-tag {
    font-size: 8px;
    padding: 2px 5px;
    border-radius:6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex-shrink: 0;
    font-weight: 600;
  }

  /* ── OUTFIT CANVAS ── */
  .canvas-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px 28px 60px;
    background: var(--bg);
  }
  .canvas-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .canvas-top h2 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .btn-add {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 7px 16px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    border-radius:6px;
    transition: opacity 0.15s;
  }
  .btn-add:hover { opacity: 0.85; }

  /* ── OUTFIT CARDS ── */
  .outfits-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .outfit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .outfit-card:hover { border-color: var(--accent2); }
  .outfit-card.has-photo { cursor: pointer; }
  .outfit-card-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .outfit-number {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }
  .outfit-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 0.02em;
  }
  .outfit-vibe {
    font-size: 10px;
    color: var(--accent);
    margin-top: 4px;
    font-style: italic;
  }
  .outfit-card-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .action-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px;
    height: 26px;
    border-radius:6px;
    cursor: pointer;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.saved { border-color: var(--green); color: var(--green); }

  .outfit-pieces {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .piece-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .piece-thumb {
    width: 30px;
    height: 38px;
    flex-shrink: 0;
    border-radius:6px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .piece-thumb:hover { border-color: var(--accent2); }
  .piece-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .piece-thumb-empty {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--border);
  }
  .piece-role {
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    width: 52px;
    flex-shrink: 0;
  }
  .piece-name {
    font-size: 11px;
    color: var(--text);
    flex: 1;
  }
  .piece-brand {
    font-size: 8px;
    padding: 2px 5px;
    border-radius:6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    flex-shrink: 0;
  }

  /* drop zone */
  .drop-zone {
    border: 1px dashed var(--border);
    border-radius:6px;
    padding: 10px 12px;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    margin: 0 16px 12px;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(226, 211, 180,0.04);
  }

  /* new outfit modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:8px;
    width: 440px;
    max-width: 95vw;
    padding: 24px;
  }
  .modal h3 {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: 20px;
  }
  .modal input, .modal textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    font-size: 12px;
    border-radius:6px;
    margin-bottom: 12px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal-footer {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    justify-content: flex-end;
  }
  .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius:6px;
  }
  .btn-cancel:hover { border-color: var(--text); color: var(--text); }

  /* color dots by brand */
  .dot-orttu  { background: #4a6fa5; }
  .dot-minoar { background: #7c6f5e; }
  .dot-ryvk   { background: #9b4a4a; }
  .dot-frkm   { background: #6b5a3e; }
  .dot-yasar  { background: #3d3d3d; }
  .dot-teamm8 { background: #4a4a7a; }
  .dot-arahant { background: #7a3040; }
  .dot-gasper  { background: #b8952a; }
  .dot-koe     { background: #8b7355; }

  .tag-orttu  { background: var(--tag-orttu);  color: #6b8fc4; }
  .tag-minoar { background: var(--tag-minoar); color: var(--accent); }
  .tag-ryvk   { background: var(--tag-ryvk);   color: #c47a7a; }
  .tag-frkm   { background: var(--tag-frkm);   color: #a08a6a; }
  .tag-yasar  { background: var(--tag-yasar);  color: var(--muted); border: 1px solid #2a2a2a; }
  .tag-teamm8  { background: var(--tag-teamm8); color: #7a7aaa; }
  .tag-arahant { background: var(--tag-arahant); color: #c08090; }
  .tag-gasper  { background: var(--tag-gasper);  color: #d4af37; }
  .tag-koe     { background: var(--tag-koe);     color: #c4a882; }

  /* saved star */
  .star { font-size: 13px; }

  /* empty state */
  .empty-card {
    border: 1px dashed var(--border);
    border-radius:8px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
  }

  /* scroll bar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius:8px; }

  .separator {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* ── IMAGE PREVIEW PANEL ── */
  .preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .preview-overlay.open { display: flex; }
  .preview-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    max-width: 700px;
    width: 92%;
    max-height: 88vh;
    overflow: hidden;
  }
  .preview-img-wrap {
    width: 300px;
    min-width: 300px;
    background: var(--surface2);
    overflow: hidden;
  }
  .preview-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .preview-no-img {
    width: 100%;
    height: 100%;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .preview-info {
    padding: 32px 28px;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .preview-close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    align-self: flex-end;
    margin-bottom: 20px;
  }
  .preview-close-btn:hover { color: var(--white); }
  .preview-brand-link {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 10px;
    display: block;
  }
  .preview-brand-link:hover { color: var(--white); }
  .preview-item-name {
    font-size: 16px;
    color: var(--white);
    line-height: 1.35;
    margin-bottom: 20px;
  }
  .preview-item-meta {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .preview-item-meta .meta-row { display: flex; gap: 8px; }
  .preview-item-meta .meta-label {
    color: #3a3a3a;
    min-width: 52px;
    text-transform: uppercase;
    font-size: 9px;
    letter-spacing: 0.1em;
    padding-top: 1px;
  }
  .piece-name-link {
    cursor: pointer;
    transition: color 0.12s;
  }
  .piece-name-link:hover {
    color: var(--white);
    text-decoration: underline;
    text-decoration-color: var(--accent);
  }
  .wardrobe-item { cursor: pointer; }

  /* ── OUTFIT PHOTO THUMBNAIL ── */
  .outfit-photo {
    width: 100%;
    aspect-ratio: 4/5;
    background: var(--surface2);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    border-bottom: 1px solid var(--border);
  }
  .outfit-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
    transition: transform 0.4s ease;
  }
  .outfit-photo:hover img { transform: scale(1.04); }
  .outfit-photo-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    min-height: 140px;
    transition: color 0.15s;
  }
  .outfit-photo-empty:hover { color: var(--accent); }
  .outfit-photo-empty::before { content: '⊕'; font-size: 18px; opacity: 0.35; }
  .btn-generate-photo {
    background: none;
    border: 1px solid #3a2e26;
    color: var(--accent2);
    padding: 5px 11px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius:6px;
    transition: all 0.15s;
    margin-top: 2px;
  }
  .btn-generate-photo:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(226, 211, 180,0.06);
  }
  .btn-generate-photo.generating {
    border-color: #4a8c5a;
    color: #6abc7e;
    pointer-events: none;
  }
  .generating-toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 10px 20px;
    border-radius:8px;
    z-index: 400;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .generating-toast.show { opacity: 1; }
  .outfit-photo-view {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    display: flex;
    align-items: flex-end;
    padding: 10px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .outfit-photo:hover .outfit-photo-view { opacity: 1; }
  .outfit-photo-view span {
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.55);
    padding: 3px 7px;
    cursor: pointer;
  }

  /* load photos button */
  .btn-load-photos {
    background: none;
    border: 1px solid var(--accent2);
    color: var(--accent);
    padding: 5px 12px;
    border-radius:8px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-load-photos:hover {
    background: rgba(226, 211, 180,0.08);
    border-color: var(--accent);
  }

  /* full-screen photo lightbox */
  .photo-lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .photo-lightbox.open { display: flex; }
  .photo-lightbox-inner {
    display: flex;
    align-items: flex-start;
    gap: 28px;
    max-height: 90vh;
  }
  .photo-lightbox img {
    max-height: 88vh;
    max-width: 60vw;
    object-fit: contain;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .photo-lightbox-info {
    width: 240px;
    flex-shrink: 0;
    color: var(--text);
    overflow-y: auto;
    max-height: 88vh;
  }
  .lb-outfit-num {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .lb-outfit-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .lb-outfit-vibe {
    font-size: 11px;
    color: var(--accent);
    font-style: italic;
    margin-bottom: 20px;
  }
  .lb-pieces-title {
    font-size: 8px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .lb-piece-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .lb-piece-thumb {
    width: 38px;
    height: 48px;
    flex-shrink: 0;
    border-radius:6px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .lb-piece-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .lb-piece-thumb-empty {
    width: 100%; height: 100%;
    background: var(--surface2);
  }
  .lb-piece-info { flex: 1; min-width: 0; }
  .lb-piece-role {
    font-size: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1px;
  }
  .lb-piece-name {
    font-size: 11px;
    color: var(--text);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

  const map = {};
  OUTFITS_DEFAULT.forEach(o => {
    const style = o.tags?.includes('night') ? 'Night Out'
      : o.tags?.includes('contrast') ? 'Contrast'
      : o.tags?.includes('tonal') ? 'Tonal'
      : 'Dark / Minimal';
    o.pieces.forEach(p => {
      if (!map[p.name]) map[p.name] = new Set();
      map[p.name].add(style);
    });
  });
  return map;
})();

function buildSidebar() {
  const el = document.getElementById('sidebar');
  const allItems = WARDROBE["Tops & Shirts"];

  // Group key function per sort mode
  const keyFn = {
    brand: item => item.brand,
    type:  item => item.cat,
    color: item => item.color || 'Unknown',
    style: item => [...(PIECE_STYLES[item.name] || new Set(['—']))][0],
  }[sidebarSort];

  // Ordered group keys
  const orderMap = {
    brand: ['ORTTU','MINOAR','RYVK','FRKM','YASAR','ARAHANT','GASPER','KOE'],
    type:  ['Shirt','Top','Cardigan','Jacket','Pants','Skirt','Boots'],
    color: null,
    style: ['Dark / Minimal','Tonal','Contrast','Night Out','—'],
  };

  const grouped = {};
  allItems.forEach(item => {
    const key = keyFn(item);
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(item);
  });

  const keys = orderMap[sidebarSort]
    ? orderMap[sidebarSort].filter(k => grouped[k])
    : Object.keys(grouped).sort();

  // add any keys not in the predefined order
  Object.keys(grouped).forEach(k => { if (!keys.includes(k)) keys.push(k); });

  let html = '';
  keys.forEach(key => {
    const items = grouped[key] || [];
    html += `<div class="sidebar-section">
      <div class="sidebar-section-header">${key}</div>`;
    items.forEach(item => {
      const b = BRANDS[item.brand] || { dot: '', label: item.brand };
      const metaParts = {
        brand: `${item.cat} · ${item.color} · ${item.size}`,
        type:  `${b.label} · ${item.color} · ${item.size}`,
        color: `${b.label} · ${item.cat} · ${item.size}`,
        style: `${b.label} · ${item.cat}`,
      }[sidebarSort];
      const tag = sidebarSort !== 'brand'
        ? `<span class="item-tag ${b.tag || ''}">${b.label}</span>` : '';
      const sidebarImgUrl = IMAGES[item.name];
      const sidebarThumb = sidebarImgUrl
        ? `<div class="item-thumb"><img src="${sidebarImgUrl}" alt="${item.name}" loading="lazy"></div>`
        : `<div class="item-thumb"><div class="item-thumb-empty"></div></div>`;
      html += `<div class="wardrobe-item" data-id="${item.id}" draggable="true">
        ${sidebarThumb}
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-meta">${metaParts}</div>
        </div>
        <div class="item-dot ${b.dot}" style="margin-left:auto;flex-shrink:0"></div>
        ${tag}
      </div>`;
    });
    html += `</div>`;
  });

  el.innerHTML = html;

  document.getElementById('stats-line').textContent =
    `${allItems.length} pieces · ${outfits.length} outfits`;

  el.querySelectorAll('.wardrobe-item').forEach(itemEl => {
    itemEl.addEventListener('click', () => {
      const item = allItems.find(i => i.id === itemEl.dataset.id);
      if (item) showPreview(item.name, item.brand);
    });
    itemEl.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', itemEl.dataset.id);
    });
  });
}

function brandTag(brand) {
  const key = brand.toUpperCase().replace(/[^A-Z]/g,'').replace('YASAR','YASAR').replace('TEAMM8','TEAMM8');
  const match = BRANDS[key] || BRANDS[brand] || { label: brand, tag: '' };
  return `<span class="piece-brand ${match.tag}">${match.label || brand}</span>`;
}

function renderCard(outfit) {
  const isSaved = saved.has(outfit.id);
  const pieces = outfit.pieces.map(p => {
    const imgUrl = IMAGES[p.name];
    const thumb = imgUrl
      ? `<div class="piece-thumb piece-name-link" data-item="${p.name}" data-brand="${p.brand}"><img src="${imgUrl}" alt="${p.name}" loading="lazy"></div>`
      : `<div class="piece-thumb piece-thumb-empty piece-name-link" data-item="${p.name}" data-brand="${p.brand}">·</div>`;
    return `
    <div class="piece-row">
      ${thumb}
      <span class="piece-role">${p.role}</span>
      <span class="piece-name piece-name-link" data-item="${p.name}" data-brand="${p.brand}">${p.name}</span>
      ${brandTag(p.brand)}
    </div>`;
  }).join('');

  const photoSrc = OUTFIT_PHOTOS[outfit.id];
  const photoHtml = photoSrc
    ? `<div class="outfit-photo" data-photo-id="${outfit.id}">
        <img src="${photoSrc}" alt="Outfit ${outfit.id}">
        <div class="outfit-photo-view">
          <span data-view-photo="${outfit.id}">↗ View</span>
        </div>
       </div>`
    : `<div class="outfit-photo outfit-photo-empty" data-pick-photo="${outfit.id}">
        <span>add photo</span>
        <button class="btn-generate-photo" data-generate="${outfit.id}">✦ Generate</button>
       </div>`;

  return `<div class="outfit-card${photoSrc ? ' has-photo' : ''}" data-id="${outfit.id}" data-tags="${(outfit.tags||[]).join(',')}">
    ${photoHtml}
    <div class="outfit-card-header">
      <div>
        <div class="outfit-number">NO. ${String(outfit.id).padStart(2,'0')}</div>
        <div class="outfit-name">${outfit.name}</div>
        <div class="outfit-vibe">${outfit.vibe || ''}</div>
      </div>
      <div class="outfit-card-actions">
        <button class="action-btn ${isSaved ? 'saved' : ''}" data-action="save" title="Save">
          <span class="star">${isSaved ? '★' : '☆'}</span>
        </button>
        <button class="action-btn" data-action="delete" title="Delete">✕</button>
      </div>
    </div>
    <div class="outfit-pieces">${pieces}</div>
    <div class="drop-zone" data-outfit-id="${outfit.id}">+ drop piece here</div>
  </div>`;
}

function renderGrid() {
  const grid = document.getElementById('outfits-grid');
  let filtered = outfits;
  if (currentFilter === 'saved') {
    filtered = outfits.filter(o => saved.has(o.id));
  } else if (currentFilter !== 'all') {
    filtered = outfits.filter(o => (o.tags||[]).includes(currentFilter));
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-card">No outfits match this filter.<br>Try "All" or create a new outfit.</div>`;
  } else {
    grid.innerHTML = filtered.map(renderCard).join('');
  }

  document.getElementById('outfit-count-label').textContent =
    `${filtered.length} Outfit${filtered.length !== 1 ? 's' : ''}`;

  // action buttons
  grid.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      const card = btn.closest('.outfit-card');
      const id = parseInt(card.dataset.id);
      if (btn.dataset.action === 'save') {
        if (saved.has(id)) saved.delete(id); else saved.add(id);
        persist();
        renderGrid();
      } else if (btn.dataset.action === 'delete') {
        outfits = outfits.filter(o => o.id !== id);
        persist();
        renderGrid();
        buildSidebar();
      }
    });
  });

  // piece image preview clicks
  grid.querySelectorAll('.piece-name-link').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      showPreview(el.dataset.item, el.dataset.brand);
    });
  });

  // photo: click anywhere on card to view fullscreen (if photo loaded)
  grid.querySelectorAll('.outfit-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('[data-action]') || e.target.closest('.drop-zone') ||
          e.target.closest('.piece-name-link') || e.target.closest('[data-pick-photo]')) return;
      const id = parseInt(card.dataset.id);
      if (!OUTFIT_PHOTOS[id]) return;
      openLightbox(id);
    });
  });

  // photo: view fullscreen (via ↗ button)
  grid.querySelectorAll('[data-view-photo]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      openLightbox(parseInt(el.dataset.viewPhoto));
    });
  });

  // photo: click empty slot to pick a single photo
  grid.querySelectorAll('[data-pick-photo]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-generate]')) return; // let generate button handle it
      e.stopPropagation();
      const input = document.getElementById('photo-single-input');
      input.dataset.outfitId = el.dataset.pickPhoto;
      input.click();
    });
  });

  // generate photo button
  grid.querySelectorAll('[data-generate]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.generate);
      generateOutfitPhoto(id, btn);
    });
  });

  // drop zones
  grid.querySelectorAll('.drop-zone').forEach(dz => {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drag-over');
      const itemId = e.dataTransfer.getData('text/plain');
      const item = WARDROBE["Tops & Shirts"].find(i => i.id === itemId);
      if (!item) return;
      const outfitId = parseInt(dz.dataset.outfitId);
      const outfit = outfits.find(o => o.id === outfitId);
      if (!outfit) return;
      outfit.pieces.push({ role: item.cat, name: item.name, brand: item.brand });
      persist();
      renderGrid();
    });
  });
}

// ─── INDEXEDDB PHOTO STORAGE ─────────────────────────────────────────────────
const IDB = {
  _db: null,
  async open() {
    if (this._db) return this._db;
    return new Promise((res, rej) => {
      const req = indexedDB.open('outfitBoardPhotos', 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore('photos');
      req.onsuccess = e => { this._db = e.target.result; res(this._db); };
      req.onerror = rej;
    });
  },
  async put(id, blob) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').put(blob, id);
      tx.oncomplete = res; tx.onerror = rej;
    });
  },
  async getAll() {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readonly');
      const out = {};
      tx.objectStore('photos').openCursor().onsuccess = e => {
        const c = e.target.result;
        if (c) { out[c.key] = c.value; c.continue(); } else res(out);
      };
      tx.onerror = rej;
    });
  }
};

// ─── PHOTO LOADING ───────────────────────────────────────────────────────────
async function applyPhotoFiles(files) {
  let matched = 0;
  const saves = [];
  [...files].forEach(f => {
    const m = f.name.match(/(?:wardrobe_)?outfit_(\d+)\.(jpg|jpeg|png|webp)/i);
    if (m) {
      const num = parseInt(m[1]);
      if (num >= 1 && num <= 21) {
        if (OUTFIT_PHOTOS[num]) URL.revokeObjectURL(OUTFIT_PHOTOS[num]);
        OUTFIT_PHOTOS[num] = URL.createObjectURL(f);
        saves.push(IDB.put(num, f));
        matched++;
      }
    }
  });
  await Promise.all(saves);
  renderGrid();
  return matched;
}

// Auto-load from IndexedDB on startup
async function initPhotos() {
  try {
    const stored = await IDB.getAll();
    let count = 0;
    Object.entries(stored).forEach(([id, blob]) => {
      OUTFIT_PHOTOS[parseInt(id)] = URL.createObjectURL(blob);
      count++;
    });
    if (count > 0) {
      renderGrid();
      const btn = document.getElementById('btn-load-photos');
      btn.textContent = `✓ ${count} Photos`;
      btn.style.borderColor = '#4a8c5a';
      btn.style.color = '#6abc7e';
    }
  } catch(e) { /* storage unavailable, skip silently */ }
}

  btn.textContent = '✦ Sending…';
  btn.classList.add('generating');

  const prompt = buildPrompt(outfit);

  // Open ChatGPT conversation in a new tab and send the prompt
  const win = window.open(CHATGPT_CONVO, '_blank');

  // Copy prompt to clipboard as fallback
  try { await navigator.clipboard.writeText(prompt); } catch(e) {}

  showToast('Prompt sent to ChatGPT → when image is ready, click the photo slot on this card to load it', 7000);

  // After a moment, inject the prompt via the opened window
  // (user may need to paste manually if the tab blocks injection)
  setTimeout(() => {
    btn.textContent = '✦ Check ChatGPT';
    btn.style.borderColor = '#4a8c5a';
    btn.style.color = '#6abc7e';
  }, 2000);
}

// ─── LIGHTBOX ────────────────────────────────────────────────────────────────
function openLightbox(outfitId) {
  const outfit = outfits.find(o => o.id === outfitId);
  if (!outfit || !OUTFIT_PHOTOS[outfitId]) return;

  document.getElementById('photo-lightbox-img').src = OUTFIT_PHOTOS[outfitId];

  const piecesHtml = outfit.pieces.map(p => {
    const imgUrl = IMAGES[p.name];
    const b = BRANDS[p.brand] || { label: p.brand };
    const thumb = imgUrl
      ? `<div class="lb-piece-thumb"><img src="${imgUrl}" alt="${p.name}" loading="lazy"></div>`
      : `<div class="lb-piece-thumb"><div class="lb-piece-thumb-empty"></div></div>`;
    return `<div class="lb-piece-row">
      ${thumb}
      <div class="lb-piece-info">
        <div class="lb-piece-role">${p.role}</div>
        <div class="lb-piece-name">${p.name}</div>
        <div class="lb-piece-brand">${b.label}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('photo-lightbox-info').innerHTML = `
    <div class="lb-outfit-num">No. ${String(outfit.id).padStart(2,'0')}</div>
    <div class="lb-outfit-name">${outfit.name}</div>
    <div class="lb-outfit-vibe">${outfit.vibe || ''}</div>
    <div class="lb-pieces-title">Pieces</div>
    ${piecesHtml}
  `;

  document.getElementById('photo-lightbox').classList.add('open');
}

// Lightbox close
document.getElementById('photo-lightbox-close').addEventListener('click', () => {
  document.getElementById('photo-lightbox').classList.remove('open');
});
document.getElementById('photo-lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('photo-lightbox').classList.remove('open');
});

// ─── INIT ────────────────────────────────────────────────────────────────────
buildSidebar();
renderGrid();
initPhotos(); // auto-load saved photos from IndexedDB
</script>
</body>
