<title>Alter — Proposals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20C33 20 29 38 31 56C33 74 42 84 50 84C58 84 67 74 69 56C71 38 67 20 50 20Z' fill='%23e2d3b4'/></svg>">
<style>
  :root {
    --bg:#0e0e0e; --surface:#161616; --surface2:#1e1e1e;
    --border:#2a2a2a; --text:#e8e4df; --muted:#6b6b6b;
    --accent:#e2d3b4; --accent2:#c9b98f; --white:#f5f2ee;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Helvetica Neue',Arial,sans-serif; min-height:100vh; }

  header { display:none; }
  .back-btn { display:none; }

  /* FILTER BAR */
  .filter-bar { background:#0a0a0a; border-bottom:1px solid var(--border); padding:12px 32px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:sticky; top:48px; z-index:90; }
  .filter-label { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-right:4px; }
  .filter-chip { background:none; border:1px solid var(--border); color:var(--muted); font-family:inherit; font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:4px 12px; border-radius:8px; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .filter-chip:hover { border-color:var(--accent2); color:var(--text); }
  .filter-chip.active { border-color:var(--accent); color:var(--accent); background:rgba(226, 211, 180,.07); }
  .filter-divider { width:1px; height:16px; background:var(--border); margin:0 4px; }
  .outfit-count { font-size:10px; color:var(--muted); letter-spacing:.06em; }
  .filter-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .view-toggle { display:flex; gap:2px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:2px; }
  .view-toggle-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:5px 9px; border-radius:6px; font-size:13px; transition:all 0.15s; line-height:1; }
  .view-toggle-btn:hover { color:var(--text); }
  .view-toggle-btn.active { background:var(--surface); color:var(--accent); }

  /* ── CARD VIEW ── */
  .proposals-list.card-view { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; flex-direction:unset; }
  .proposal-card.card-view { min-height:unset; aspect-ratio:3/4; flex-direction:column; position:relative; overflow:hidden; background:var(--surface2); cursor:pointer; }
  .proposal-card.card-view .proposal-photo { width:100%; min-width:unset; height:100%; border-right:none; position:absolute; inset:0; }
  .proposal-card.card-view .proposal-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; }
  .proposal-card.card-view .proposal-right { display:none; }
  .proposal-card.card-view .cv-gradient { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(0,0,0,0) 30%,rgba(0,0,0,0.8) 100%); pointer-events:none; }
  .proposal-card.card-view .cv-info { position:absolute; bottom:0; left:0; right:0; padding:14px; }
  .proposal-card.card-view .cv-number { font-size:9px; letter-spacing:.14em; color:rgba(255,255,255,0.45); text-transform:uppercase; margin-bottom:2px; }
  .proposal-card.card-view .cv-name { font-size:14px; font-weight:600; color:var(--white); line-height:1.2; }
  .proposal-card.card-view .cv-vibe { font-size:10px; color:var(--accent); font-style:italic; margin-top:3px; }
  .proposal-card.card-view .cv-spider { display:block; margin-bottom:6px; pointer-events:none; }

  /* ── GRID VIEW ── */
  .proposals-list.grid-view { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; flex-direction:unset; }
  .proposal-card.grid-view { min-height:unset; flex-direction:column; }
  .proposal-card.grid-view .proposal-photo { width:100%; min-width:unset; height:220px; border-right:none; border-bottom:1px solid var(--border); }
  .proposal-card.grid-view .proposal-right { display:flex; }
  .proposal-card.grid-view .proposal-stats,
  .proposal-card.grid-view .proposal-pieces,
  .proposal-card.grid-view .proposal-rationale { display:none; }
  .proposal-card.grid-view .proposal-header { border-bottom:none; padding:14px 16px; }

  /* ── CUSTOM PROPOSALS ── */
  .custom-proposal { border-color: rgba(226, 211, 180,0.2); }
  .custom-badge { background: rgba(226, 211, 180,0.15) !important; color: var(--accent) !important; border: 1px solid var(--accent2) !important; }
  .custom-collage { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; width:100%; height:100%; gap:1px; background:var(--border); }
  .custom-collage img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .custom-delete-btn { background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:4px 8px; transition:color 0.15s; flex-shrink:0; }
  .custom-delete-btn:hover { color:var(--danger); }

  /* MAIN */
  .main { padding:28px 32px 80px; }
  .proposals-list { display:flex; flex-direction:column; gap:16px; }
  .proposal-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; display:flex; min-height:400px; transition:border-color .2s; }
  .proposal-card:hover { border-color:var(--accent2); }
  .proposal-card.best { border-color:var(--accent); }
  .proposal-card[style*="display:none"] { display:none !important; }

  /* PHOTO */
  .proposal-photo { width:360px; min-width:360px; background:var(--surface2); border-right:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; flex-shrink:0; }
  .proposal-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .proposal-photo-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted); font-size:9px; letter-spacing:.12em; text-transform:uppercase; width:100%; min-height:400px; }
  .proposal-photo-empty::before { content:"⊕"; font-size:24px; opacity:.2; }
  .best-badge { position:absolute; top:12px; left:12px; background:var(--accent); color:#000; font-size:8px; letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; border-radius:8px; font-weight:700; }
  .session-badge { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,.6); color:var(--muted); font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:8px; }
  .approved-badge { position:absolute; top:12px; right:12px; background:rgba(0,180,100,0.85); color:#fff; font-size:8px; letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; border-radius:8px; font-weight:700; }

  /* RIGHT */
  .proposal-right { flex:1; display:flex; flex-direction:column; min-width:0; }
  .proposal-header { padding:18px 22px 14px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .proposal-num { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .proposal-name { font-size:20px; font-weight:600; color:var(--white); line-height:1.2; margin-bottom:4px; }
  .proposal-vibe { font-size:10px; color:var(--accent); font-style:italic; }
  .proposal-cat { font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:3px 9px; border:1px solid var(--border); color:var(--muted); border-radius:8px; flex-shrink:0; margin-top:2px; }

  /* STATS */
  .proposal-stats { display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.02); }
  .stat-bars { display:flex; flex-direction:column; gap:3px; }
  .stat-row { display:flex; align-items:center; gap:6px; }
  .stat-name { font-size:8px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); width:58px; }
  .stat-track { width:80px; height:2px; background:var(--border); border-radius:8px; overflow:hidden; }
  .stat-fill { height:100%; background:var(--accent); border-radius:8px; }
  .stat-val { font-size:9px; color:var(--accent); width:18px; }

  /* PIECES */
  .proposal-pieces { display:flex; gap:10px; padding:14px 22px; overflow-x:auto; flex-shrink:0; }
  .piece-card { flex-shrink:0; width:140px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface2); cursor:pointer; transition:border-color .15s; }
  .piece-card:hover { border-color:var(--accent2); }
  .piece-img { width:140px; height:168px; overflow:hidden; background:var(--surface2); }
  .piece-img img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .piece-img-empty { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--border); font-size:20px; }
  .piece-info { padding:7px 9px 9px; }
  .piece-role { font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
  .piece-name { font-size:10px; color:var(--text); line-height:1.3; }
  .piece-brand { font-size:9px; color:var(--accent2); margin-top:1px; }

  /* RATIONALE */
  .proposal-rationale { flex:1; padding:14px 22px; font-size:12px; line-height:1.7; color:var(--muted); border-top:1px solid var(--border); }
  .proposal-notes { display:flex; flex-wrap:wrap; gap:8px; padding:0 22px 14px; }
  .proposal-note { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  .note-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; }

  @media (max-width: 768px) {
    /* NAV */
    header { padding: 12px 16px; }
    .back-btn { padding: 5px 10px; font-size: 9px; }

    /* FILTER BAR */
    .filter-bar { padding: 10px 16px; overflow-x: auto; flex-wrap: nowrap; gap: 6px; top: 48px; }
    .filter-chip { white-space: nowrap; flex-shrink: 0; }
    .outfit-count { display: none; }

    /* MAIN */
    .main { padding: 16px 12px 60px; }

    /* PROPOSAL CARD — stack vertically */
    .proposal-card { flex-direction: column; min-height: unset; }
    .proposal-photo {
      width: 100% !important; min-width: unset !important;
      min-height: 320px; border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .proposal-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .best-badge { top: 10px; left: 10px; }
    .session-badge { bottom: 10px; left: 10px; }

    /* HEADER */
    .proposal-header { padding: 14px 16px 12px; flex-wrap: wrap; gap: 8px; }
    .proposal-name { font-size: 17px; }

    /* STATS */
    .proposal-stats { padding: 12px 16px; gap: 10px; }
    .stat-bars { flex: 1; }
    .stat-track { max-width: unset; flex: 1; }

    /* PIECES */
    .proposal-pieces { padding: 12px 14px; gap: 8px; }
    .piece-card { width: 120px; }
    .piece-img { width: 120px; height: 144px; }
    .piece-name { font-size: 10px; }

    /* RATIONALE */
    .proposal-rationale { padding: 12px 16px; font-size: 12px; }
    .proposal-notes { padding: 0 16px 12px; }

    /* EVENT CONTEXT */
    .event-context { padding: 14px 16px; }
    .event-title { font-size: 18px; }
  }

  @media (max-width: 480px) {
    .proposal-photo { min-height: 260px; }
    .piece-card { width: 100px; }
    .piece-img { width: 100px; height: 120px; }
  }

</style>

function getImg(name, fallback) {
  if (!name) return fallback||"";
  if (IMAGES[name]) return IMAGES[name];
  const lower = name.toLowerCase();
  const key = Object.keys(IMAGES).find(k => k.toLowerCase()===lower || k.toLowerCase().includes(lower) || lower.includes(k.toLowerCase()));
  return key ? IMAGES[key] : (fallback||"");
}

function drawSpider(stats, size) {
  if (!stats) return "";
  const keys=["drama","edge","formality","structure","skin"];
  const labels=["Drama","Edge","Form.","Struct.","Skin"];
  const pad=size*.22, W=size+pad*2, cx=W/2, cy=W/2, r=size*.28, labelR=size*.38, n=keys.length;
  const ang=i=>(Math.PI*2/n)*i-Math.PI/2;
  const px=(i,rr)=>(cx+rr*Math.cos(ang(i))).toFixed(1);
  const py=(i,rr)=>(cy+rr*Math.sin(ang(i))).toFixed(1);
  let rings="";
  for(let ring=1;ring<=5;ring++){const pts=keys.map((_,i)=>px(i,r*(ring/5))+","+py(i,r*(ring/5))).join(" ");rings+='<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>';}
  const axes=keys.map((_,i)=>'<line x1="'+cx+'" y1="'+cy+'" x2="'+px(i,r)+'" y2="'+py(i,r)+'" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>').join("");
  const dataPts=keys.map((k,i)=>{const v=stats[k]||0;return px(i,r*(v/5))+","+py(i,r*(v/5));}).join(" ");
  const poly='<polygon points="'+dataPts+'" fill="#e2d3b4" fill-opacity="0.25" stroke="#e2d3b4" stroke-width="1.5"/>';
  const dots=keys.map((k,i)=>{const v=stats[k]||0;return'<circle cx="'+px(i,r*(v/5))+'" cy="'+py(i,r*(v/5))+'" r="2" fill="#e2d3b4"/>';}).join("");
  const fs=(W*.062).toFixed(1);
  const lbls=labels.map((lbl,i)=>{
    const lx=(cx+labelR*Math.cos(ang(i))).toFixed(1),ly=(cy+labelR*Math.sin(ang(i))).toFixed(1);
    const c=Math.cos(ang(i)),s=Math.sin(ang(i));
    const anchor=c>.3?"start":c<-.3?"end":"middle";
    const dy=s>.3?"0.8em":s<-.3?"0em":"0.35em";
    return'<text x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'" dy="'+dy+'" fill="rgba(255,255,255,0.45)" font-size="'+fs+'" font-family="Helvetica Neue,Arial,sans-serif">'+lbl+'</text>';
  }).join("");
  const ws=W.toFixed(0);
  return'<svg width="'+ws+'" height="'+ws+'" viewBox="0 0 '+ws+' '+ws+'" xmlns="http://www.w3.org/2000/svg">'+rings+axes+poly+dots+lbls+'</svg>';
}

// ── FILTER STATE ──
let activeSession = "all";
const WARDROBE_IDS = new Set([42, 43, 45, 46, 47, 49, 50, 52]);
let activeCat = "all";

function buildSessionChips() {
  const bar = document.getElementById("filter-bar");
  const divider = bar.querySelector(".filter-divider");
  SESSIONS.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "filter-chip";
    btn.dataset.session = s.id;
    btn.textContent = s.label;
    btn.addEventListener("click", () => setSessionFilter(s.id));
    bar.insertBefore(btn, divider);
  });
  document.querySelectorAll("[data-session]").forEach(btn => {
    btn.addEventListener("click", () => setSessionFilter(btn.dataset.session));
    // Apply active state based on initial activeSession
    if (btn.dataset.session === activeSession) btn.classList.add("active");
    else btn.classList.remove("active");
  });
  document.querySelectorAll("[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => setCatFilter(btn.dataset.cat));
  });
}

function setSessionFilter(id) {
  activeSession = id;
  document.querySelectorAll("[data-session]").forEach(b => b.classList.toggle("active", b.dataset.session===id));
  applyFilters();
}
function setCatFilter(cat) {
  activeCat = cat;
  document.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("active", b.dataset.cat===cat));
  applyFilters();
}

function applyFilters() {
  const cards = document.querySelectorAll(".proposal-card");
  let visible = 0;
  cards.forEach(card => {
    const sessionMatch = activeSession==="all" || card.dataset.session===activeSession;
    const catMatch = activeCat==="all" || card.dataset.cat===activeCat;
    const show = sessionMatch && catMatch;
    card.style.display = show ? "" : "none";
    if (show) visible++;
  });
  document.getElementById("outfit-count").textContent = visible + " outfit" + (visible!==1?"s":"");
  document.getElementById("header-sub").textContent = activeSession==="all" ? "All sessions · " + visible + " outfits" : (SESSIONS.find(s=>s.id===activeSession)||{label:""}).label;
}

let proposalViewMode = "card"; // "card" | "grid" | "editorial"

function renderAll() {
  const list = document.getElementById("proposals-list");
  list.className = "proposals-list" + (proposalViewMode !== "editorial" ? " " + proposalViewMode + "-view" : "");

  const customProposals = JSON.parse(localStorage.getItem("CUSTOM_PROPOSALS") || "[]");

  list.innerHTML = SESSIONS.flatMap(session =>
    session.outfits.map((outfit, i) => {
      const photoHtml = outfit.photo
        ? "<img src='" + outfit.photo + "' alt='" + outfit.name + "' loading='lazy'>"
        : "<div class='proposal-photo-empty'><span>Photo pending</span></div>";

      const piecesHtml = outfit.pieces.map(p => {
        const img = p.img || getImg(p.name);
        return "<div class='piece-card'>" +
          "<div class='piece-img'>" + (img?"<img src='"+img+"' alt='"+p.name+"' loading='lazy'>":"<div class='piece-img-empty'>◈</div>") + "</div>" +
          "<div class='piece-info'><div class='piece-role'>"+p.role+"</div><div class='piece-name'>"+p.name+"</div><div class='piece-brand'>"+p.brand+"</div></div>" +
          "</div>";
      }).join("");

      const statsHtml = outfit.stats
        ? "<div class='proposal-stats'>" +
            drawSpider(outfit.stats, 80) +
            "<div class='stat-bars'>" +
            ["drama","edge","structure","skin","formality"].map(k=>
              "<div class='stat-row'><div class='stat-name'>"+k+"</div><div class='stat-track'><div class='stat-fill' style='width:"+(outfit.stats[k]||0)*20+"%'></div></div><div class='stat-val'>"+(outfit.stats[k]||0)+"</div></div>"
            ).join("") +
            "</div></div>"
        : "";

      // Card view overlay (spider + info over image)
      const cardOverlay = proposalViewMode === "card" && outfit.stats
        ? "<div class='cv-gradient'></div><div class='cv-info'>" +
            "<div class='cv-spider'>" + drawSpider(outfit.stats, 64) + "</div>" +
            "<div class='cv-number'>#" + outfit.id + "</div>" +
            "<div class='cv-name'>" + outfit.name + "</div>" +
            "<div class='cv-vibe'>" + outfit.vibe + "</div>" +
          "</div>"
        : proposalViewMode === "card"
        ? "<div class='cv-gradient'></div><div class='cv-info'>" +
            "<div class='cv-number'>#" + outfit.id + "</div>" +
            "<div class='cv-name'>" + outfit.name + "</div>" +
            "<div class='cv-vibe'>" + outfit.vibe + "</div>" +
          "</div>"
        : "";

      const cardClass = "proposal-card" + (proposalViewMode !== "editorial" ? " " + proposalViewMode + "-view" : "");

      const approvedBadge = WARDROBE_IDS.has(outfit.id) ? "<div class='approved-badge'>✓ In Wardrobe</div>" : "";
      return "<div class='" + cardClass + "' data-session='"+session.id+"' data-cat='"+outfit.category+"'>" +
        "<div class='proposal-photo'><div class='session-badge'>"+session.label+"</div>" + approvedBadge + photoHtml + cardOverlay + "</div>" +
        "<div class='proposal-right'>" +
          "<div class='proposal-header'>" +
            "<div><div class='proposal-num'>#"+outfit.id+"</div><div class='proposal-name'>"+outfit.name+"</div><div class='proposal-vibe'>"+outfit.vibe+"</div></div>" +
            "<div class='proposal-cat'>"+outfit.category+"</div>" +
          "</div>" +
          statsHtml +
          "<div class='proposal-pieces'>"+piecesHtml+"</div>" +
          (outfit.rationale?"<div class='proposal-rationale'>"+outfit.rationale+"</div>":"") +
        "</div></div>";
    })
  ).join("") + (customProposals.length ? renderCustomProposals(customProposals) : "");

  // wire delete buttons
  document.querySelectorAll(".custom-delete-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const updated = JSON.parse(localStorage.getItem("CUSTOM_PROPOSALS") || "[]").filter(p => p.id !== id);
      localStorage.setItem("CUSTOM_PROPOSALS", JSON.stringify(updated));
      renderAll();
    });
  });

  applyFilters();
}

function renderCustomProposals(customs) {
  return customs.map(outfit => {
    const cardClass = "proposal-card custom-proposal" + (proposalViewMode !== "editorial" ? " " + proposalViewMode + "-view" : "");

    // Collage: up to 4 piece thumbnails
    const imgs = outfit.pieces.slice(0,4).map(p => p.img).filter(Boolean);
    let photoHtml;
    if (imgs.length >= 2) {
      photoHtml = "<div class='custom-collage'>" + imgs.map(src =>
        "<img src='" + src + "' alt='' loading='lazy'>"
      ).join("") + "</div>";
    } else if (imgs.length === 1) {
      photoHtml = "<img src='" + imgs[0] + "' alt='' loading='lazy' style='width:100%;height:100%;object-fit:cover;object-position:top center'>";
    } else {
      photoHtml = "<div class='proposal-photo-empty'><span>Custom Outfit</span></div>";
    }

    const cardOverlay = proposalViewMode === "card"
      ? "<div class='cv-gradient'></div><div class='cv-info'>" +
          "<div class='cv-number'>CUSTOM</div>" +
          "<div class='cv-name'>" + outfit.name + "</div>" +
          "<div class='cv-vibe'>" + outfit.date + "</div>" +
        "</div>"
      : "";

    const piecesHtml = outfit.pieces.map(p =>
      "<div class='piece-card'>" +
        "<div class='piece-img'>" + (p.img ? "<img src='" + p.img + "' alt='" + p.name + "' loading='lazy'>" : "<div class='piece-img-empty'>◈</div>") + "</div>" +
        "<div class='piece-info'><div class='piece-role'>" + p.role + "</div><div class='piece-name'>" + p.name + "</div><div class='piece-brand'>" + p.brand + "</div></div>" +
      "</div>"
    ).join("");

    return "<div class='" + cardClass + "' data-session='custom' data-cat='custom'>" +
      "<div class='proposal-photo'><div class='session-badge custom-badge'>Closet</div>" + photoHtml + cardOverlay + "</div>" +
      "<div class='proposal-right'>" +
        "<div class='proposal-header'>" +
          "<div><div class='proposal-num'>CUSTOM</div><div class='proposal-name'>" + outfit.name + "</div><div class='proposal-vibe'>" + outfit.date + "</div></div>" +
          "<button class='custom-delete-btn' data-id='" + outfit.id + "' title='Delete'>✕</button>" +
        "</div>" +
        "<div class='proposal-pieces'>" + piecesHtml + "</div>" +
      "</div></div>";
  }).join("");
}

// View toggle wiring
document.getElementById("vtoggle-card").addEventListener("click", () => {
  proposalViewMode = "card";
  document.getElementById("vtoggle-card").classList.add("active");
  document.getElementById("vtoggle-grid").classList.remove("active");
  document.getElementById("vtoggle-editorial").classList.remove("active");
  renderAll();
});
document.getElementById("vtoggle-grid").addEventListener("click", () => {
  proposalViewMode = "grid";
  document.getElementById("vtoggle-grid").classList.add("active");
  document.getElementById("vtoggle-card").classList.remove("active");
  document.getElementById("vtoggle-editorial").classList.remove("active");
  renderAll();
});
document.getElementById("vtoggle-editorial").addEventListener("click", () => {
  proposalViewMode = "editorial";
  document.getElementById("vtoggle-editorial").classList.add("active");
  document.getElementById("vtoggle-card").classList.remove("active");
  document.getElementById("vtoggle-grid").classList.remove("active");
  renderAll();
});

// Pre-select the most recent session before building chips
const lastSession = SESSIONS[SESSIONS.length - 1];
activeSession = lastSession.id;
buildSessionChips();
renderAll();
