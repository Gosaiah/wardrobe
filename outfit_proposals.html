<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alter — Proposals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20C33 20 29 38 31 56C33 74 42 84 50 84C58 84 67 74 69 56C71 38 67 20 50 20Z' fill='%23e2d3b4'/></svg>">
<style>
  :root {
    --bg:#0e0e0e; --surface:#161616; --surface2:#1e1e1e;
    --border:#2a2a2a; --text:#e8e4df; --muted:#6b6b6b;
    --accent:#e2d3b4; --accent2:#c9b98f; --white:#f5f2ee;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Helvetica Neue',Arial,sans-serif; min-height:100vh; }

  header { display:none; }
  .back-btn { display:none; }

  /* FILTER BAR */
  .filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .filter-label { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-right:4px; }
  /* .filter-chip styling is shared (alter-theme.css filter/context chip) */
  .filter-divider { width:1px; height:16px; background:var(--border); margin:0 4px; }
  .outfit-count { font-size:10px; color:var(--muted); letter-spacing:.06em; }
  .filter-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  /* .view-toggle / .view-toggle-btn are single-sourced in components.css + alter-theme.css */

  /* Card layout — proposals render the shared .outfit-card (data.js/alter-theme).
     These containers just arrange them per view mode. */
  .proposals-list { display:flex; flex-direction:column; gap:16px; }
  /* .proposals-list.card-view grid is single-sourced in alter-theme.css (.card-grid family). */
  .proposals-list.grid-view { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }

  /* Card overlays: session / added / closet badges + custom delete button */
  /* .custom-badge is single-sourced in alter-theme.css */
  .session-badge { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,.6); color:var(--muted); font-size:8px; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:8px; z-index:3; }
  .approved-badge { position:absolute; top:12px; right:12px; background:rgba(0,180,100,0.85); color:#fff; font-size:8px; letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; border-radius:8px; font-weight:700; z-index:3; }
  .custom-delete-btn { background:rgba(0,0,0,.5); border:none; color:#fff; font-size:12px; cursor:pointer; padding:3px 7px; border-radius:8px; transition:color 0.15s; }
  .custom-delete-btn:hover { color:var(--danger); }

  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; }

  @media (max-width: 768px) {
    /* NAV */
    header { padding: 12px 16px; }
    .back-btn { padding: 5px 10px; font-size: 9px; }

    /* FILTER BAR */
    .filter-bar { overflow-x: auto; flex-wrap: nowrap; gap: 6px; }
    .filter-chip { white-space: nowrap; flex-shrink: 0; }
    .outfit-count { display: none; }

    /* card-view mobile 2-col handled by the shared .card-grid rule in alter-theme.css */
  }

</style>
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="alter-theme.css">
<script>(function(){try{var t=localStorage.getItem('alter-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>

<script src="nav.js"></script>

<main class="app-page">
  <div class="page-header">
    <div class="page-title-wrap">
      <h1 class="page-title">Proposals</h1>
      <div class="page-sub">Generated outfit ideas, grouped by session. Filter by character, then open any card for the full look.</div>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <span id="prop-filters-slot"></span>
    <div class="filter-right">
      <span class="outfit-count" id="outfit-count"></span>
      <div class="view-toggle">
        <button class="view-toggle-btn active" id="vtoggle-card" title="Card view">&#9646;</button>
        <button class="view-toggle-btn" id="vtoggle-grid" title="Grid view">&#9776;</button>
        <button class="view-toggle-btn" id="vtoggle-editorial" title="Editorial view">&#9783;</button>
      </div>
    </div>
  </div>

  <div class="proposals-list" id="proposals-list"></div>
</main>

<!-- Detail popups (outfit + item) are injected + wired by the shared modals.js -->

<script src="data.js"></script>
<script src="modals.js"></script>
<script src="facet-filter.js"></script>
<script src="filter-modal.js"></script>
<script>
// IMAGES + getImg are provided by shared data.js
// drawSpider() consolidated into data.js — shared 8-spoke renderer

// ── ALL PROPOSALS — append new sessions below ──
const SESSIONS_SRC = [

  },
  {
    id:"session-6", label:"Session · Jul 27 · Off-Duty", event:"Off-Duty — Civilian day looks, Zara Tunic + Alo shorts (#53–#63)", notes:"Everyday-ease proposals built from existing pieces. Awaiting photos; promote to the main board once shot.",
    outfits:[
      {id:53, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:54, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:55, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:56, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:57, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:58, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:59, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:60, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:61, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:62, rationale:"Off-duty proposal — built from existing pieces.", notes:[]},
      {id:63, rationale:"Off-duty proposal — built from existing pieces.", notes:[]}
    ]
  }
];

// Hydrate compact session refs into full cards by resolving each outfit from the shared data.js
// catalog (pieces, brand labels, images, computed stats). Single source of truth — no duplication.
function hydrateSessions(SRC){
  var POOL=(typeof OUTFITS_DEFAULT!=="undefined")?OUTFITS_DEFAULT:[];
  return SRC.map(function(s){
    return { id:s.id, label:s.label, event:s.event, notes:s.notes,
      outfits: s.outfits.map(function(ref){
        var o=POOL.find(function(x){return x.id===ref.id;});
        if(!o) return null;
        // Shared effective-stats aggregator (8 facets + base + combos) — no local duplication.
        var stats=(typeof effectiveOutfitStats==="function")?effectiveOutfitStats(o):null;
        return { id:o.id, name:o.name, vibe:o.vibe, category:o.vibe,
          // Shared photo resolver: real (zero-padded) path only when the outfit actually
          // has a photo; otherwise "" so outfitCardHtml's piece-collage fallback kicks in.
          photo:(typeof outfitHasPhoto==="function" && outfitHasPhoto(o.id)) ? outfitPhotoPath(o.id) : "",
          pieces:o.pieces.map(function(p){ return {role:p.role, name:p.name, brand:(BRANDS[p.brand]&&BRANDS[p.brand].label)||p.brand, img:pieceImg(p)}; }),
          stats:stats, rationale:ref.rationale||"", notes:ref.notes||[] };
      }).filter(Boolean)
    };
  });
}
const SESSIONS = hydrateSessions(SESSIONS_SRC);



// ── FILTER STATE ──
let activeSession = "all";
// "Added" badge = outfit is live on the main board (not a pending proposal). Derived from shared data.
const WARDROBE_IDS = new Set((typeof OUTFITS_DEFAULT !== "undefined" ? OUTFITS_DEFAULT : []).filter(function(o){ return o.source !== "proposed"; }).map(function(o){ return o.id; }));
let activeCat = "all";
let propFacetCtl = null;      // stat sliders (facet-filter.js)
let propFilterBtn = null;

const PROP_CATS = [["all","All"],["Dark / Minimal","Dark"],["Contrast","Contrast"],["Tonal","Tonal"],["Night Out","Night Out"]];

function setSessionFilter(id) {
  activeSession = id;
  document.querySelectorAll("[data-session]").forEach(b => b.classList.toggle("active", b.dataset.session===id));
  applyFilters();
}
function setCatFilter(cat) {
  activeCat = cat;
  document.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("active", b.dataset.cat===cat));
  applyFilters();
}

function propActiveCount(){
  let n = 0;
  if (activeSession !== "all") n++;
  if (activeCat !== "all") n++;
  if (propFacetCtl && propFacetCtl.values) FacetFilter.KEYS.forEach(k => { if (propFacetCtl.values[k] > 0) n++; });
  return n;
}
function syncPropCount(){ if (propFilterBtn) propFilterBtn.setCount(propActiveCount()); }

function applyFilters() {
  const facetOn = propFacetCtl && propFacetCtl.active();
  const cards = document.querySelectorAll(".outfit-card[data-session]");
  let visible = 0;
  cards.forEach(card => {
    const sessionMatch = activeSession==="all" || card.dataset.session===activeSession;
    const catMatch = activeCat==="all" || card.dataset.cat===activeCat;
    let facetMatch = true;
    if (facetOn) { const o = PROPOSAL_INDEX[card.dataset.id]; facetMatch = !!(o && propFacetCtl.matches(o.stats)); }
    const show = sessionMatch && catMatch && facetMatch;
    card.style.display = show ? "" : "none";
    if (show) visible++;
  });
  const cnt = document.getElementById("outfit-count"); if (cnt) cnt.textContent = visible + " outfit" + (visible!==1?"s":"");
  const hs = document.getElementById("header-sub"); if (hs) hs.textContent = activeSession==="all" ? "All sessions · " + visible + " outfits" : (SESSIONS.find(s=>s.id===activeSession)||{label:""}).label;
  syncPropCount();
}

// ── Filters modal: Session/date + Category + Stat sliders ──
function chipRow(items, activeVal, onPick){
  const wrap = document.createElement("div"); wrap.className = "fm-chips";
  wrap.innerHTML = items.map(it => "<button class='filter-chip" + (it[0]===activeVal ? " active" : "") + "' data-v='" + it[0] + "'>" + it[1] + "</button>").join("");
  wrap.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
    wrap.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("active", x === b));
    onPick(b.dataset.v);
  }));
  return wrap;
}
function propGroup(label, el){ const g = document.createElement("div"); g.className = "fm-group"; g.innerHTML = "<span class='fm-label'>" + label + "</span>"; g.appendChild(el); return g; }

function setupProposalFilterModal(){
  if (typeof FilterModal === "undefined") return;
  const facetWrap = document.createElement("div");
  const sessionItems = [["all","All"]].concat(SESSIONS.map(s => [s.id, s.label]));
  const sessionRow = chipRow(sessionItems, activeSession, setSessionFilter);
  const catRow = chipRow(PROP_CATS, activeCat, setCatFilter);
  const modal = FilterModal.create({ title:"Filter proposals", onReset:function(){
    setSessionFilter("all"); setCatFilter("all"); if (propFacetCtl) propFacetCtl.reset();
    sessionRow.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("active", x.dataset.v === "all"));
    catRow.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("active", x.dataset.v === "all"));
    syncPropCount();
  }});
  modal.body.appendChild(propGroup("Session / date", sessionRow));
  modal.body.appendChild(propGroup("Category", catRow));
  modal.body.appendChild(facetWrap);
  propFilterBtn = FilterModal.trigger("Filters");
  document.getElementById("prop-filters-slot").appendChild(propFilterBtn);
  propFilterBtn.addEventListener("click", modal.open);
  propFacetCtl = FacetFilter.mount(facetWrap, function(){ applyFilters(); });
  syncPropCount();
}

let proposalViewMode = "card"; // "card" | "grid" | "editorial"

function renderAll() {
  const list = document.getElementById("proposals-list");
  list.className = "proposals-list" + (proposalViewMode !== "editorial" ? " " + proposalViewMode + "-view" : "");

  const customProposals = JSON.parse(localStorage.getItem("CUSTOM_PROPOSALS") || "[]");

  // Index every outfit (session + custom) by id so cards can open the shared detail popup.
  PROPOSAL_INDEX = {};
  SESSIONS.forEach(s => s.outfits.forEach(o => { PROPOSAL_INDEX[String(o.id)] = o; }));
  customProposals.forEach(o => { PROPOSAL_INDEX[String(o.id)] = o; });

  list.innerHTML = SESSIONS.flatMap(session =>
    session.outfits.map(outfit => {
      // Shared outfit card (data.js) — same component as the Outfits page.
      const badges = "<div class='session-badge'>" + session.label + "</div>" +
        (WARDROBE_IDS.has(outfit.id) ? "<div class='approved-badge'>&#10003; Added</div>" : "");
      return outfitCardHtml(outfit, {
        view: proposalViewMode,
        photo: outfit.photo || "",
        kicker: "#" + outfit.id,
        dataAttrs: "data-session='" + session.id + "' data-cat='" + outfit.category + "'",
        badges: badges
      });
    })
  ).join("") + (customProposals.length ? renderCustomProposals(customProposals) : "");

  // wire delete buttons
  document.querySelectorAll(".custom-delete-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const updated = JSON.parse(localStorage.getItem("CUSTOM_PROPOSALS") || "[]").filter(p => p.id !== id);
      localStorage.setItem("CUSTOM_PROPOSALS", JSON.stringify(updated));
      renderAll();
    });
  });

  // wire card clicks → shared outfit-detail popup
  document.querySelectorAll(".outfit-card[data-id]").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".custom-delete-btn") || e.target.closest(".piece-name-link")) return;
      openProposalOutfit(card.dataset.id);
    });
  });

  applyFilters();
}

// ── Shared outfit-detail popup (uses data.js outfitDetailInfoHtml) ──
let PROPOSAL_INDEX = {};
// Detail popups now come from the shared modals.js. Proposals pass the pre-resolved
// photo path (empty → outfitCardHtml's collage fallback kicks in).
function openProposalOutfit(id) {
  const outfit = PROPOSAL_INDEX[String(id)];
  if (outfit) Modals.openOutfit(outfit, { photoSrc: outfit.photo || "" });
}
document.addEventListener("click", e => {
  const piece = e.target.closest(".outfit-detail-piece");
  if (piece) Modals.openItem(piece.dataset.name, piece.dataset.brand);
});

function renderCustomProposals(customs) {
  return customs.map(outfit => {
    // Shared outfit card; no photo → piece-image collage fallback (built into outfitCardHtml).
    const badges = "<div class='session-badge custom-badge'>Closet</div>" +
      "<button class='custom-delete-btn' data-id='" + outfit.id + "' title='Delete' style='position:absolute;top:10px;right:10px;z-index:3'>&#10005;</button>";
    return outfitCardHtml(outfit, {
      view: proposalViewMode,
      photo: "",
      kicker: "CUSTOM",
      dataAttrs: "data-session='custom' data-cat='custom'",
      badges: badges
    });
  }).join("");
}

// View toggle wiring
document.getElementById("vtoggle-card").addEventListener("click", () => {
  proposalViewMode = "card";
  document.getElementById("vtoggle-card").classList.add("active");
  document.getElementById("vtoggle-grid").classList.remove("active");
  document.getElementById("vtoggle-editorial").classList.remove("active");
  renderAll();
});
document.getElementById("vtoggle-grid").addEventListener("click", () => {
  proposalViewMode = "grid";
  document.getElementById("vtoggle-grid").classList.add("active");
  document.getElementById("vtoggle-card").classList.remove("active");
  document.getElementById("vtoggle-editorial").classList.remove("active");
  renderAll();
});
document.getElementById("vtoggle-editorial").addEventListener("click", () => {
  proposalViewMode = "editorial";
  document.getElementById("vtoggle-editorial").classList.add("active");
  document.getElementById("vtoggle-card").classList.remove("active");
  document.getElementById("vtoggle-grid").classList.remove("active");
  renderAll();
});

// Escape/backdrop close handled by the shared modals.js.

// Pre-select the most recent session before building the filter modal
const lastSession = SESSIONS[SESSIONS.length - 1];
activeSession = lastSession.id;
setupProposalFilterModal();
renderAll();
</script>
</body>
</html>
