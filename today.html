<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20C33 20 29 38 31 56C33 74 42 84 50 84C58 84 67 74 69 56C71 38 67 20 50 20Z' fill='%23e2d3b4'/></svg>">
<title>Alter · Today</title>
<style>
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); margin: 0; }
  /* page width/padding + header come from shared .app-page / .page-header (alter-theme.css) */
  /* ── Weather hero: lead with the temp + what garment types to reach for / skip ── */
  .t-weather-hero { display: flex; align-items: center; gap: 22px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 18px 22px; margin-bottom: 22px; }
  .t-wh-temp { font-size: 46px; font-weight: 700; color: var(--white); line-height: 1; letter-spacing: -0.02em; white-space: nowrap; display: flex; align-items: baseline; gap: 4px; }
  .t-wh-temp .t-wh-unit { font-size: 18px; color: var(--muted); font-weight: 500; }
  .t-wh-temp .t-wh-sun { font-size: 22px; margin-right: 4px; align-self: center; }
  .t-wh-body { flex: 1; min-width: 0; }
  .t-wh-cond { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .t-wh-headline { font-size: 16px; color: var(--white); font-weight: 600; margin: 3px 0 11px; }
  .t-wh-rows { display: flex; flex-direction: column; gap: 7px; }
  .t-wh-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .t-wh-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); width: 34px; flex-shrink: 0; }
  .t-wh-chip { font-size: 11px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .t-wh-chip.wear { color: var(--accent); border-color: var(--accent2); background: var(--accent-soft, rgba(226,211,180,0.1)); }
  .t-wh-chip.skip { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); opacity: 0.85; }
  @media (max-width: 560px) { .t-weather-hero { flex-direction: column; align-items: flex-start; gap: 14px; } .t-wh-temp { font-size: 40px; } }

  /* ── "Right now" section: today's check-in photo + closet nudges ── */
  .t-now { display: grid; grid-template-columns: 250px 1fr 1fr; gap: 14px; margin-bottom: 26px; align-items: start; }
  .t-now-photo { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; }
  .t-now-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .t-now-photo-cap { position: absolute; inset: auto 0 0 0; padding: 12px 12px 11px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
  .t-now-kicker { font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .t-now-photo-title { color: var(--white); font-size: 13px; font-weight: 600; line-height: 1.2; }
  .t-now-photo-meta { color: rgba(255,255,255,0.7); font-size: 10px; margin-top: 2px; }
  .t-now-photo.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; border-style: dashed; cursor: default; color: var(--muted); padding: 16px; }
  .t-now-photo.empty .ph-mark { width: 30px; height: 30px; opacity: 0.5; }
  .t-now-empty-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .t-now-empty-sub { font-size: 10px; }
  .t-now-block { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 13px 14px 8px; }
  .t-now-block-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white); }
  .t-now-block-sub { font-size: 10px; color: var(--muted); margin: 2px 0 8px; }
  .t-mini { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: none; border-top: 1px solid var(--border); padding: 6px 0; cursor: pointer; text-align: left; font-family: inherit; }
  .t-now-block .t-mini:first-of-type { border-top: none; }
  .t-mini-thumb { width: 28px; height: 36px; border-radius: 5px; overflow: hidden; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 13px; }
  .t-mini-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .t-mini-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .t-mini-name { display: block; max-width: 100%; font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-mini-sub { display: block; max-width: 100%; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-mini-code { font-family: ui-monospace, monospace; font-size: 10px; color: var(--accent); flex-shrink: 0; background: var(--surface2); border-radius: 5px; padding: 1px 6px; }
  .t-now-more { font-size: 10px; color: var(--muted); padding: 8px 0 2px; }
  @media (max-width: 680px) { .t-now { grid-template-columns: 1fr; } .t-now-photo { max-width: 280px; } }

  .t-contexts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  /* .t-chip styling is shared (alter-theme.css filter/context chip) */

  .t-section-label { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

  /* Toolbar (why + actions + view toggle) above the 3 recommended outfits.
     The toggle restyles all 3 together via the shared outfitCardHtml view modes. */
  .t-toolbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .t-toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .t-why { font-size: 12px; color: var(--muted); line-height: 1.5; max-width: 560px; margin: 0; }
  .t-actions { display: flex; gap: 10px; }
  .t-shuffle-btn { font-size: 11px !important; text-transform: uppercase; padding: 10px 16px !important; }

  /* Results grid — card/grid views tile and STRETCH to fill the full width (auto-fit,
     not auto-fill, so 3 cards spread across instead of bunching left); editorial stacks. */
  /* .t-results (card/grid views) grid is single-sourced in alter-theme.css (.card-grid family). */
  .t-results.editorial { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
  .today-hero { border-color: var(--accent2) !important; }

  /* .view-toggle / .view-toggle-btn are single-sourced in components.css + alter-theme.css */

  @media (max-width: 560px) { .t-alts { grid-template-columns: 1fr; } }
</style>

<main class="app-page">
  <div class="page-header">
    <div class="page-title-wrap">
      <h1 class="page-title">Today</h1>
      <div class="page-sub" id="t-greeting"></div>
    </div>
  </div>
  <div class="t-weather-hero" id="t-weather-hero">Checking the weather&hellip;</div>
  <div class="t-now" id="t-now"></div>
  <div class="t-contexts" id="t-contexts"></div>
  <div id="t-rec"></div>

<!-- Detail popups (outfit + item) are injected + wired by the shared modals.js -->


<script>
// ── Config ───────────────────────────────────────────────────────────────────
const NYC = { lat: 40.7831, lon: -73.9712, label: "Manhattan" };
const CONTEXTS = {
  office:      { label: "Office",    personas: ["overlord","civilian","wanderer"] },
  "going-out": { label: "Going out", personas: ["night-shift"] },
  casual:      { label: "Casual",    personas: ["wanderer","civilian"] },
  date:        { label: "Date",      personas: ["night-shift","civilian","overlord","wanderer"] }
};
const CHIP_ORDER = ["office","going-out","casual","date"];

// ── State ────────────────────────────────────────────────────────────────────
let currentContext = inferContext();
let currentTemp = null;      // °F once weather loads
let recOffset = 0;           // "show another" cursor
let builtCache = null;       // last built combo (for popup lookup)
let todayView = "card";      // card | grid | editorial (shared outfit-card views)
let uploadedPhotos = {};     // board photo uploads (shared IndexedDB store) — same as Outfits

// ── Context inference (weekday) ──────────────────────────────────────────────
function inferContext(){
  const d = new Date().getDay();          // 0 Sun … 6 Sat
  if (d === 2 || d === 4) return "office"; // Tue / Thu
  if (d === 5 || d === 6) return "going-out"; // Fri / Sat
  return "casual";
}
function officeFormalityTarget(){
  const d = new Date().getDay();
  return d === 2 ? 2.0 : d === 4 ? 3.5 : 2.75; // Tue relaxed, Thu sharp, else mid
}

// ── Weather ──────────────────────────────────────────────────────────────────
function tempBand(t){
  if (t == null) return null;
  if (t <= 32) return "freezing";
  if (t <= 49) return "cold";
  if (t <= 62) return "cool";
  if (t <= 75) return "mild";
  if (t <= 85) return "warm";
  return "hot";
}
const BAND_NOTE = {
  freezing: "bundle up", cold: "layer up", cool: "a light layer",
  mild: "easy layers", warm: "keep it light", hot: "minimal layers"
};
async function loadWeather(){
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + NYC.lat + "&longitude=" + NYC.lon +
      "&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FNew_York";
    const r = await fetch(url);
    const j = await r.json();
    currentTemp = Math.round(j.current.temperature_2m);
  } catch (e) { currentTemp = null; }
  renderWeatherHero();
  render(); // re-rank with the weather nudge
}
// What garment types make sense for today's temperature (drives the decision before context).
const BAND_LABEL = { freezing:"Freezing", cold:"Cold", cool:"Cool", mild:"Mild", warm:"Warm", hot:"Hot" };
function weatherGuidance(temp){
  const band = tempBand(temp);
  const G = {
    hot:      { headline:"Keep it light",  wear:["Sleeveless","Short sleeves","Light bottoms"],        skip:["Long sleeves","Layers","Outerwear"] },
    warm:     { headline:"Stay light",      wear:["Short sleeves","Sleeveless","Light bottoms"],        skip:["Long sleeves","Heavy layers","Coats"] },
    mild:     { headline:"Easy layers",     wear:["Short or long sleeves","One light layer"],           skip:["Heavy coats"] },
    cool:     { headline:"Add a layer",     wear:["Long sleeves","A jacket or overshirt"],              skip:["Bare arms alone"] },
    cold:     { headline:"Layer up",        wear:["Coat or jacket","Long sleeves","Knit layers"],       skip:["Sleeveless"] },
    freezing: { headline:"Bundle up",       wear:["Heavy coat","Warm layers","Cover arms & legs"],      skip:["Exposed skin"] }
  };
  return Object.assign({ band: band }, G[band] || G.mild);
}
function renderWeatherHero(){
  const el = document.getElementById("t-weather-hero"); if (!el) return;
  if (currentTemp == null){
    el.innerHTML = "<div class='t-wh-body'><div class='t-wh-cond'>" + NYC.label + "</div>" +
      "<div class='t-wh-headline'>Weather unavailable — picking on style alone.</div></div>";
    return;
  }
  const g = weatherGuidance(currentTemp);
  const chips = (arr, cls) => (arr || []).map(t => "<span class='t-wh-chip " + cls + "'>" + t + "</span>").join("");
  el.innerHTML =
    "<div class='t-wh-temp'><span class='t-wh-sun'>&#9728;</span>" + currentTemp + "<span class='t-wh-unit'>°F</span></div>" +
    "<div class='t-wh-body'>" +
      "<div class='t-wh-cond'>" + (BAND_LABEL[g.band] || "") + " &middot; " + NYC.label + "</div>" +
      "<div class='t-wh-headline'>" + g.headline + " today</div>" +
      "<div class='t-wh-rows'>" +
        "<div class='t-wh-row'><span class='t-wh-label'>Wear</span>" + chips(g.wear, "wear") + "</div>" +
        (g.skip && g.skip.length ? "<div class='t-wh-row'><span class='t-wh-label'>Skip</span>" + chips(g.skip, "skip") + "</div>" : "") +
      "</div>" +
    "</div>";
}

// ── Outfit helpers ───────────────────────────────────────────────────────────
function outfitStatsOf(o){
  return (typeof effectiveOutfitStats === "function" && effectiveOutfitStats(o))
    || (typeof outfitBaseStats === "function" && outfitBaseStats(o))
    || o.stats || null;
}
// Weather fit now uses the shared garment-warmth model (data.js: outfitWeatherFit) —
// replaces the old outfit-level skin/hasOuter heuristic.

function scoreOutfit(o, ctx, band){
  const st = outfitStatsOf(o); if (!st) return -999;
  const def = CONTEXTS[ctx]; let s = 0;
  if (o.persona && def.personas.includes(o.persona)) s += 2.5;
  if (ctx === "office"){
    s += 2 - Math.abs((st.formality||0) - officeFormalityTarget());
    s += (st.structure||0) * 0.2;
    s -= (st.skin||0) * 0.3;
  } else if (ctx === "going-out"){
    s += ((st.drama||0) + (st.edge||0) + (st.skin||0)) * 0.25;
  } else if (ctx === "casual"){
    s += (3 - Math.abs((st.formality||0) - 1.5)) * 0.5;
    s += (st.movement||0) * 0.15;
    s -= Math.max(0, (st.formality||0) - 3) * 0.5;
  } else if (ctx === "date"){
    s += ((st.presence||0) + (st.edge||0)) * 0.25 + (st.drama||0) * 0.15;
    s -= Math.abs((st.skin||0) - 2.5) * 0.15;
  }
  // Weather fit by garment warmth: hard-drop a severe mismatch (coat at 80°, mesh at 30°),
  // soft-nudge the rest. Sentinel score = dropped (filtered out in getRecommendations).
  const fit = (typeof outfitWeatherFit === "function") ? outfitWeatherFit(o, band) : { drop:false, nudge:0 };
  if (fit.drop) return -9999;
  s += fit.nudge;
  return s;
}

// ── Recommendation ───────────────────────────────────────────────────────────
function savedPool(){ return (typeof _allOutfits === "function" ? _allOutfits() : (typeof OUTFITS_DEFAULT !== "undefined" ? OUTFITS_DEFAULT : [])).filter(o => o.pieces && o.pieces.length); }

function buildContextCombo(ctx, band, offset){
  const def = CONTEXTS[ctx];
  // Don't anchor on something too warm to wear at all today (e.g. a coat when it's hot).
  const bw = (band && typeof BAND_WARMTH !== "undefined" && BAND_WARMTH[band]) ? BAND_WARMTH[band] : null;
  // anchor = a wardrobe top/outer whose best-fit persona suits the context, most statement first
  const anchors = (typeof WARDROBE_DATA !== "undefined" ? WARDROBE_DATA : [])
    .filter(it => it.stats && ["top","outer"].includes(pieceRole(it)) && def.personas.includes(getItemPersona(it))
      && !(bw && itemWarmth(it) > bw.hardMax))
    .sort((a,b) => ((b.stats.drama||0) - (a.stats.drama||0)));
  if (!anchors.length) return null;
  const anchor = anchors[offset % anchors.length];
  const sugg = (typeof buildPairings === "function") ? buildPairings(anchor, { persona: getItemPersona(anchor), band: band }) : [];
  if (!sugg.length) return null;
  return { id: null, name: "Fresh combination", vibe: def.label, persona: getItemPersona(anchor), pieces: sugg[0].pieces, _built: true };
}

function getRecommendations(){
  const band = tempBand(currentTemp);
  const scored = savedPool().map(o => ({ o: o, s: scoreOutfit(o, currentContext, band) }));
  const fitting = scored.filter(x => x.s > -9000).sort((a,b) => b.s - a.s);   // drop weather-severe mismatches
  const n = fitting.length;
  const hero = n ? fitting[recOffset % n].o : null;
  const alt  = n > 1 ? fitting[(recOffset + 1) % n].o : null;
  const built = buildContextCombo(currentContext, band, recOffset);
  const droppedByWeather = scored.filter(x => x.s <= -9000).length;
  return { hero: hero, alt: alt, built: built, droppedByWeather: droppedByWeather, fittingCount: n };
}

// ── Why-it-fits copy ─────────────────────────────────────────────────────────
function whyLine(o){
  const d = new Date().getDay();
  let base;
  if (currentContext === "office") base = d === 2 ? "Tuesday office — relaxed but put-together."
    : d === 4 ? "Thursday office — sharp and structured." : "Office — put-together.";
  else if (currentContext === "going-out") base = "Going out — turned up.";
  else if (currentContext === "casual") base = "Casual day — easy and comfortable.";
  else base = "Date — considered, a little edge.";
  const band = tempBand(currentTemp);
  if (band && currentTemp != null){
    const w = (typeof outfitWarmth === "function") ? outfitWarmth(o) : null;
    base += " " + currentTemp + "°F, so " + (w != null && w >= 3 ? "there's a layer to keep you warm." : "kept light.");
  }
  return base;
}

// ── "Right now" section: today's check-in + closet nudges ─────────────────────
let todayWearCache = null;
function todayISO(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function nowMiniRow(x){
  const it = x.it;
  const img = (typeof IMAGES !== "undefined" && IMAGES[it.name]) || it.img || "";
  const bl = (typeof BRANDS !== "undefined" && BRANDS[bkey(it.brand)] && BRANDS[bkey(it.brand)].label) || it.brand || "";
  const thumb = img ? "<img src='" + img + "' alt='' loading='lazy'>" : "&#9672;";
  return "<button class='t-mini piece-name-link' data-name=\"" + it.name + "\" data-brand=\"" + (it.brand||"") + "\">" +
    "<span class='t-mini-thumb'>" + thumb + "</span>" +
    "<span class='t-mini-body'><span class='t-mini-name'>" + it.name + "</span><span class='t-mini-sub'>" + bl + (x.n ? " · " + x.n + "× worn" : "") + "</span></span>" +
    "<span class='t-mini-code'>" + it.id + "</span></button>";
}
function nowBlock(label, sub, list, total){
  const rows = list.length ? list.map(nowMiniRow).join("") : "<div class='t-now-more'>Nothing here — nice rotation.</div>";
  const more = total > list.length ? "<div class='t-now-more'>+" + (total - list.length) + " more</div>" : "";
  return "<div class='t-now-block'><div class='t-now-block-label'>" + label + "</div><div class='t-now-block-sub'>" + sub + "</div>" + rows + more + "</div>";
}
function renderNow(){
  const el = document.getElementById("t-now"); if (!el) return;
  // Today's check-in photo (from a wear logged today)
  todayWearCache = (typeof _wearHistory === "function" ? _wearHistory() : []).find(w => w.date === todayISO()) || null;
  let photoCard;
  if (todayWearCache){
    const w = todayWearCache;
    const outfit = (w.outfitId != null) ? savedPool().find(o => o.id === w.outfitId) : null;
    const photo = w.photo || (outfit ? outfitPhotoSrc(outfit.id, uploadedPhotos) : "");
    const occ = (typeof wearOccasionList === "function" ? wearOccasionList(w) : []).map(occasionLabel).join(" · ");
    const meta = [occ, (currentTemp != null ? currentTemp + "°F" : "")].filter(Boolean).join(" · ");
    const inner = photo ? "<img src='" + photo + "' alt='Today'>"
      : "<div class='t-now-photo empty'>" + (typeof outfitPlaceholderInner === "function" ? outfitPlaceholderInner("Logged") : "") + "</div>";
    photoCard = "<div class='t-now-photo' id='t-today-wear'>" + inner +
      "<div class='t-now-photo-cap'><div class='t-now-kicker'>Today · worn</div>" +
      "<div class='t-now-photo-title'>" + (outfit ? outfit.name : "Today's look") + "</div>" +
      (meta ? "<div class='t-now-photo-meta'>" + meta + "</div>" : "") + "</div></div>";
  } else {
    photoCard = "<div class='t-now-photo empty'>" +
      "<svg class='ph-mark' viewBox='0 0 100 100' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round'><path d='M50 20 C33 20 29 38 31 56 C33 74 42 84 50 84 C58 84 67 74 69 56 C71 38 67 20 50 20 Z' stroke-width='4'/></svg>" +
      "<span class='t-now-empty-label'>No look logged today</span>" +
      "<span class='t-now-empty-sub'>Pick one below</span></div>";
  }
  // Closet nudges — garments only (skip accessories / jewelry buffs), and only pieces that
  // actually make sense for today's temperature (no heavy coats at 89°, no tanks at 30°).
  const band = (typeof tempBand === "function") ? tempBand(currentTemp) : null;
  const bw = (band && typeof BAND_WARMTH !== "undefined" && BAND_WARMTH[band]) ? BAND_WARMTH[band] : null;
  const fitsToday = it => { if (!bw || typeof itemWarmth !== "function") return true; const w = itemWarmth(it); return w >= bw.hardMin && w <= bw.hardMax; };
  const items = (typeof WARDROBE_DATA !== "undefined" ? WARDROBE_DATA : []).filter(it => {
    const role = (typeof pieceRole === "function") ? pieceRole(it) : it.type;
    if (role === "accessory") return false;
    if (typeof isJewelryEnhancement === "function" && isJewelryEnhancement(it)) return false;
    return fitsToday(it);
  });
  const withN = items.map(it => ({ it, n: getWearCount("item", it.id), last: getLastWorn("item", it.id), added: it.added || "" }));
  const never = withN.filter(x => x.n === 0).sort((a,b) => (b.added||"").localeCompare(a.added||"") || a.it.name.localeCompare(b.it.name));
  const least = withN.filter(x => x.n >= 1).sort((a,b) => a.n - b.n || (a.last||"").localeCompare(b.last||""));
  const forToday = bw ? " · good for today" : "";
  const neverSub = (never.some(x => x.added) ? "New arrivals + never worn" : "Haven't worn these yet") + forToday;
  el.innerHTML = photoCard +
    nowBlock("New &amp; never worn", neverSub, never.slice(0,6), never.length) +
    nowBlock("Worn least", "Rotate these back in" + forToday, least.slice(0,6), least.length);
}

// ── Rendering (reuses the shared outfitCardHtml — card/grid/editorial views) ──
function viewToggleHtml(){
  const b = (v, ic, t) => "<button class='view-toggle-btn" + (todayView === v ? " active" : "") + "' data-view='" + v + "' title='" + t + "'>" + ic + "</button>";
  return "<div class='view-toggle'>" + b("card","&#9646;","Card") + b("grid","&#9776;","Grid") + b("editorial","&#9783;","Editorial") + "</div>";
}

function render(){
  const rec = getRecommendations();

  // Toolbar: why + Show another + view toggle. (Wear logging is captured via the
  // photo → Claude flow that seeds data.js, not a local button.)
  const actions =
    ((rec.hero || rec.built) ? "<button class='action-btn t-shuffle-btn' id='t-shuffle'>Show another</button>" : "");
  let whyText;
  if (rec.hero){
    whyText = whyLine(rec.hero);
    if (rec.droppedByWeather > 0) whyText += " · " + rec.droppedByWeather + " saved look" + (rec.droppedByWeather > 1 ? "s" : "") + " set aside for the weather.";
  } else if (rec.droppedByWeather > 0){
    whyText = "Nothing saved suits " + (currentTemp != null ? currentTemp + "°" : "today") + " — here's a fresh build.";
  } else {
    whyText = "No saved outfit fits this context yet — try another context.";
  }
  const toolbar = "<div class='t-toolbar'>" +
    "<div class='t-why'>" + whyText + "</div>" +
    "<div class='t-toolbar-right'>" + actions + viewToggleHtml() + "</div>" +
  "</div>";

  // The 3 recommended outfits, all restyled together by todayView
  const cards = [];
  if (rec.hero) cards.push(outfitCardHtml(rec.hero, { view: todayView, photo: outfitPhotoSrc(rec.hero.id, uploadedPhotos), kicker: "Today's pick", cardClass: "today-hero" }));
  if (rec.alt)  cards.push(outfitCardHtml(rec.alt,  { view: todayView, photo: outfitPhotoSrc(rec.alt.id, uploadedPhotos),  kicker: "Also saved" }));
  if (rec.built){
    builtCache = rec.built;
    const imgs = (rec.built.pieces||[]).map(p => pieceImg(p)).filter(Boolean);
    cards.push(outfitCardHtml(rec.built, { view: todayView, collage: imgs, kicker: "New", cardClass: "today-built" }));
  }

  const resultsClass = "t-results" + (todayView === "editorial" ? " editorial" : "");
  document.getElementById("t-rec").innerHTML = toolbar + "<div class='" + resultsClass + "'>" + cards.join("") + "</div>";
  renderNow();
}

function renderChips(){
  document.getElementById("t-contexts").innerHTML = CHIP_ORDER.map(c =>
    "<button class='t-chip" + (c === currentContext ? " active" : "") + "' data-ctx='" + c + "'>" + CONTEXTS[c].label + "</button>"
  ).join("");
}

function renderHead(){
  const now = new Date();
  const h = now.getHours();
  const greet = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const date = now.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
  document.getElementById("t-greeting").textContent = greet + ", Zay · " + date;
}

// Detail popups now come from the shared modals.js — openOutfit passes Today's live
// uploaded photos through so the outfit photo matches the board.
function openTodayOutfit(outfit, opts){
  opts = opts || {}; opts.uploads = uploadedPhotos;
  Modals.openOutfit(outfit, opts);
}

// ── Events ───────────────────────────────────────────────────────────────────
document.addEventListener("click", function(e){
  const piece = e.target.closest(".outfit-detail-piece, .piece-name-link");
  if (piece){ e.stopPropagation(); Modals.openItem(piece.dataset.name, piece.dataset.brand); return; }
  const tw = e.target.closest("#t-today-wear");
  if (tw && todayWearCache && typeof Modals !== "undefined" && Modals.openWear){ Modals.openWear(todayWearCache, { uploads: uploadedPhotos }); return; }
  const chip = e.target.closest(".t-chip");
  if (chip){ currentContext = chip.dataset.ctx; recOffset = 0; renderChips(); render(); return; }
  const vbtn = e.target.closest(".view-toggle-btn[data-view]");
  if (vbtn){ todayView = vbtn.dataset.view; render(); return; }
  if (e.target.id === "t-shuffle"){ e.stopPropagation(); recOffset++; render(); return; }
  const builtCard = e.target.closest(".today-built");
  if (builtCard){ openTodayOutfit(builtCache, { kicker: "Built for today" }); return; }
  const card = e.target.closest(".outfit-card[data-id]");
  if (card){ const o = savedPool().find(x => x.id === parseInt(card.dataset.id, 10)); if (o) openTodayOutfit(o); return; }
});
// Escape/backdrop close handled by the shared modals.js.

// ── Init ─────────────────────────────────────────────────────────────────────
if (typeof Store !== "undefined") { try { Store.load(); } catch(e){} }  // refresh local cache (picks up new committed wears/outfits)
renderHead();
renderChips();
render();
loadWeather();
// Pull the board's uploaded photos (same IndexedDB store) so Today shows the same images.
if (typeof loadUploadedOutfitPhotos === "function") {
  loadUploadedOutfitPhotos().then(function(m){ uploadedPhotos = m || {}; render(); });
}
</script>
</body>
</html>
