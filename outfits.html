<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alter — Wardrobe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20C33 20 29 38 31 56C33 74 42 84 50 84C58 84 67 74 69 56C71 38 67 20 50 20Z' fill='%23e2d3b4'/></svg>">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e4df;
    --muted: #6b6b6b;
    --accent: #e2d3b4;
    --accent2: #c9b98f;
    --white: #f5f2ee;
    --green: var(--success, #2e7d32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }


  /* ── TAB PANELS ── */
  /* Cap the workspace to the shared page width so Outfits/Wardrobe/Builder/History
     line up with every other page (Today, Shop, etc.). Nav stays full-width. */
  .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; width: 100%; max-width: var(--page-max); margin: 0 auto; }
  .tab-panel.active { display: flex; }

  /* ── ORIGINAL OUTFIT BOARD STYLES (preserved exactly) ── */
  header.board-header {
    background: #000;
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    flex-shrink: 0;
  }
  .board-header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .board-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header.board-header .page-title { margin: 0; }
  /* .filter-btn / .pf-btn styling is shared (alter-theme.css filter/context chip) */
  .container { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding-bottom: 32px;
  }
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #111;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  .sidebar-tab {
    flex: 1;
    padding: 9px 4px;
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sidebar-section { border-bottom: 1px solid var(--border); }
  .sidebar-section-header {
    padding: 12px 16px 10px;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    background: #111;
    position: sticky;
    top: 37px;
    z-index: 2;
  }
  .wardrobe-item {
    padding: 6px 12px;
    border-bottom: 1px solid rgba(42,42,42,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: background 0.1s;
    user-select: none;
  }
  .wardrobe-item:hover { background: var(--surface2); }
  .item-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .item-thumb {
    width: 32px;
    height: 40px;
    flex-shrink: 0;
    border-radius:6px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .item-thumb-empty { width: 100%; height: 100%; background: var(--surface2); }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .item-meta { font-size: 9px; color: var(--muted); margin-top: 1px; }
  .item-tag { font-size: 8px; padding: 2px 5px; border-radius:6px; letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0; font-weight: 600; }
  .canvas-area { flex: 1; overflow-y: auto; padding: 28px 28px 60px; background: var(--bg); }
  .canvas-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .canvas-top h2 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .btn-add {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 7px 16px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    border-radius:6px;
    transition: opacity 0.15s;
    font-family: inherit;
  }
  .btn-add:hover { opacity: 0.85; }
  .outfits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  /* Outfit card base/header/pieces CSS now single-sourced in alter-theme.css (scoped .outfit-card …).
     Only rules alter-theme lacks or intentionally differs on are kept inline below. */
  .outfit-card:hover { border-color: var(--accent2); }
  .outfit-number { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 2px; }
  .outfit-name { font-size: 13px; font-weight: 600; color: var(--white); letter-spacing: 0.02em; }
  .outfit-vibe { font-size: 10px; color: var(--accent); margin-top: 4px; font-style: italic; }
  .outfit-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .action-btn { background: none; border: 1px solid var(--border); color: var(--muted); width: 26px; height: 26px; border-radius:6px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.saved { border-color: var(--green); color: var(--green); }
  /* .outfit-pieces / .piece-row / .piece-thumb* / .piece-role now single-sourced in alter-theme.css (scoped) */
  .piece-name { font-size: 11px; color: var(--text); flex: 1; cursor: pointer; }
  .piece-name:hover { color: var(--white); text-decoration: underline; text-decoration-color: var(--accent); }
  /* Brand dots (used via BRANDS[..].dot on .item-dot) */
  .dot-orttu { background: #4a6fa5; } .dot-minoar { background: #7c6f5e; } .dot-ryvk { background: #9b4a4a; }
  .dot-frkm { background: #6b5a3e; } .dot-yasar { background: #3d3d3d; } .dot-arahant { background: #7a3040; }
  .empty-card { border: 1px dashed var(--border); border-radius:8px; padding: 40px 24px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.7; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius:8px; }
  .separator { height: 1px; background: var(--border); margin: 4px 0; }
  .piece-name-link { cursor: pointer; transition: color 0.12s; }
  .piece-name-link:hover { color: var(--white); text-decoration: underline; text-decoration-color: var(--accent); }

  /* ── MODAL (original) ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 600; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius:8px; width: 440px; max-width: 95vw; padding: 24px; }
  .modal h3 { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white); margin-bottom: 20px; }
  .modal input, .modal textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; font-size: 12px; border-radius:6px; margin-bottom: 12px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal-footer { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .btn-cancel { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 16px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius:6px; font-family: inherit; }
  .btn-cancel:hover { border-color: var(--text); color: var(--text); }

  /* ── OUTFITS TAB — no sidebar ── */
  #tab-board .sidebar { display: none !important; }
  #tab-board .container { display: block; }
  #tab-board .canvas-area { padding: 20px 24px 60px; overflow-y: auto; height: calc(100vh - 160px); }

  /* ── ITEM DETAIL MODAL ── */
  .item-detail-overlay {
    position: fixed; inset: 0; z-index: 1200;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
  }
  .item-detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:10px;
    width: clamp(320px, 96vw, 1100px);
    max-height: 92vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .item-detail-inner { display: flex; overflow: hidden; flex: 1; min-height: 0; align-items: stretch; }
  .item-detail-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
    padding: 4px 10px; border-radius:10px; font-size: 0.9rem;
    z-index: 10; transition: color 0.2s, border-color 0.2s;
    font-family: inherit;
  }
  .item-detail-close:hover { color: var(--white); border-color: var(--white); }
  .item-detail-inner { display: flex; overflow: hidden; flex: 1; min-height: 0; }
  .item-detail-photo-col {
    width: 40%; flex-shrink: 0;
    background: var(--surface2);
    border-right: 1px solid var(--border);
    overflow: hidden;
    align-self: stretch;
  }
  .item-detail-photo { width: 100%; height: 100%; }
  .item-detail-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .item-detail-photo-empty {
    width: 300px; height: 400px; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.12); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .popup-info-col { flex: 1; overflow-y: auto; padding: clamp(16px, 3vw, 28px); min-width: 0; }
  .item-detail-info-col { flex: 1; overflow-y: auto; padding: clamp(16px, 3vw, 28px); min-width: 0; }
  .item-detail-brand-name {
    font-size: 0.7rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .item-detail-name {
    font-size: 1.4rem; font-weight: 600;
    color: var(--white); line-height: 1.2; margin-bottom: 12px;
  }
  .item-detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .item-detail-tag {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius:8px;
    padding: 3px 9px;
    font-size: 0.68rem; letter-spacing: 0.06em;
    color: var(--muted); text-transform: uppercase;
  }
  .item-detail-section-title {
    font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .item-detail-outfits { margin-bottom: 26px; }
  .item-detail-outfit-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .item-detail-outfit-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius:10px;
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color 0.2s;
    font-size: 0.75rem; color: var(--text);
  }
  .item-detail-outfit-chip:hover { border-color: var(--accent2); }
  .item-detail-outfit-photo {
    width: 32px; height: 40px;
    border-radius:8px; overflow: hidden;
    background: var(--surface); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: rgba(255,255,255,0.2);
  }
  .item-detail-outfit-photo img { width:100%;height:100%;object-fit:cover; }
  .item-detail-outfit-num { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .item-detail-outfit-name { font-weight: 500; color: var(--text); }
  .item-detail-pairs { margin-bottom: 10px; }
  .item-detail-pairs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
  }
  .pair-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius:10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
    text-align: center;
  }
  .pair-card:hover { border-color: var(--accent2); }
  .pair-card-thumb { width: 100%; aspect-ratio: 2/3; background: var(--surface); overflow: hidden; }
  .pair-card-thumb img { width:100%;height:100%;object-fit:cover;object-position:top center; }
  .pair-card-thumb-empty {
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,0.1);font-size:0.6rem;text-transform:uppercase;
  }
  .pair-card-name { padding: 4px 5px 6px; font-size: 0.62rem; color: var(--muted); line-height: 1.3; }
  .pair-count-badge {
    display: inline-block;
    background: rgba(255,255,255,0.07);
    border-radius:8px;
    padding: 1px 4px;
    font-size: 0.58rem;
    color: var(--accent);
    margin-top: 2px;
  }
  /* ── STATS OVERLAY ON GRID PHOTO ── */
  .outfit-photo-stats-overlay {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,0.5);
    border-radius:10px; padding: 6px;
    pointer-events: none;
    backdrop-filter: blur(3px);
  }
  .outfit-photo-stats-overlay svg { display: block; }

  /* ── OUTFIT PHOTO ON CARD ── */
  .outfit-photo {
    width: 100%;
    aspect-ratio: 4/5;
    background: var(--surface2);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    border-bottom: 1px solid var(--border);
  }
  .outfit-photo img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    display: block;
    transition: transform 0.4s ease;
  }
  .outfit-photo:hover img { transform: scale(1.04); }
  .outfit-photo-empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: var(--muted);
    font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; min-height: 120px;
  }


  /* ── STATS ── */
  .spider-wrap { display:flex; align-items:center; justify-content:center; padding:12px 0 8px; }
  .outfit-spider-wrap { display:flex; align-items:center; justify-content:center; gap:12px; padding:10px 16px 12px; border-top:1px solid var(--border); }
  .spider-legend { display:flex; flex-direction:column; gap:4px; }
  .spider-legend-item { display:flex; align-items:center; gap:5px; font-size:8px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
  .spider-legend-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  /* stat filters */
  .stat-filter-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 24px; border-bottom:1px solid var(--border); background:#111; }
  .stat-filter-label { font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
  .stat-filter-group { display:flex; align-items:center; gap:5px; }
  .stat-filter-name { font-size:9px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
  .stat-range { accent-color:var(--accent); width:70px; cursor:pointer; }


  /* horizontal/editorial + h-piece + view-toggle + card-view CSS now shared in alter-theme.css */

  /* ══════════════════════════════════════
     MOBILE RESPONSIVE — max-width 768px
  ══════════════════════════════════════ */
  @media (max-width: 768px) {
    /* BOARD HEADER */
    .board-header { padding: 10px 16px; flex-direction: column; align-items: flex-start; gap: 6px; }
    .filter-btn { padding: 6px 10px; font-size: 10px; }
    .btn-add, #btn-load-photos { padding: 6px 12px; font-size: 10px; }

    /* FILTER ROWS — scroll horizontally, no wrap */
    .filter-row { flex-wrap: nowrap !important; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; margin-top: 0 !important; }
    .filter-row::-webkit-scrollbar { display: none; }

    /* STAT FILTER ROW */
    .stat-filter-row { padding: 8px 16px; gap: 6px; overflow-x: auto; flex-wrap: nowrap; }
    .stat-range { width: 50px; }

    /* SIDEBAR — hide on mobile */
    .sidebar { display: none !important; }

    /* MAIN LAYOUT */
    .container { height: auto; }
    .canvas-area { padding: 16px 12px 40px; }
    .canvas-top { margin-bottom: 12px; }

    /* OUTFIT GRID — 2 columns on tablet */
    .outfits-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }

    /* OUTFIT CARD VERTICAL */
    .outfit-card.horizontal { flex-direction: column; height: auto; min-height: unset; }
    .outfit-card.horizontal .outfit-photo {
      width: 100% !important; min-width: unset !important; max-width: unset !important;
      aspect-ratio: 4/5; border-right: none; border-bottom: 1px solid var(--border);
    }
    .h-pieces-row { gap: 8px; padding: 12px 14px; }
    .h-piece-card { width: 120px; }
    .h-piece-img { width: 120px; height: 148px; }
    .outfit-card-horizontal-right { width: 100%; }
    .outfit-card.horizontal .outfit-card-header { padding: 14px 16px 10px; }

    /* OUTFIT CARD VERTICAL (grid view) */
    .outfit-photo { aspect-ratio: 3/4; }
    .piece-row { gap: 6px; }
    .piece-role { width: 40px; font-size: 7px; }

    /* VIEW TOGGLE */
    .view-toggle { margin-left: auto; }

    /* ITEM DETAIL MODAL */
    .item-detail-panel { width: 100%; max-height: 100vh; height: 100vh; border-radius: 0; flex-direction: column; }
    .item-detail-inner { flex-direction: column; overflow-y: auto; }
    .item-detail-photo-col { width: 100%; height: 280px; border-right: none; border-bottom: 1px solid var(--border); }
    .item-detail-photo img { height: 100%; }
    .item-detail-info-col { padding: 20px 18px; overflow-y: visible; }
    .item-detail-pairs-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }

    /* MODALS */
    .modal { width: 95vw; padding: 20px 16px; }

    /* ── POPUP PANELS MOBILE ── */
    .item-detail-inner { flex-direction: column; }
    .item-detail-photo-col { width: 100%; min-height: 40vw; max-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    .item-detail-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .item-detail-info-col,
    .popup-info-col { padding: 16px; max-height: 50vh; overflow-y: auto; }
    .item-detail-panel { width: 96vw !important; max-height: 95vh; }

    /* SPIDER CHART — scale down on small screens */
    .outfit-spider-wrap svg { width: 70px !important; height: 70px !important; }
  }

  @media (max-width: 480px) {
    /* OUTFIT GRID — single column on phone */
    .outfits-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .h-piece-card { width: 100px; }
    .h-piece-img { width: 100px; height: 124px; }
    .h-piece-name { font-size: 9px; }
  }
</style>

<link rel="stylesheet" href="alter-theme.css">

<body>

<script src="nav.js"></script>

<!-- ══ TAB: OUTFIT BOARD ══ -->
<div class="tab-panel active" id="tab-board">
  <header class="board-header">
    <div class="board-header-top">
      <h1 class="page-title">Outfits</h1>
      <div class="board-actions">
        <span id="board-filters-slot"></span>
        <button class="btn-add" id="btn-new-outfit">+ New Outfit</button>
        <button id="btn-load-photos" style="background:none;border:1px solid var(--accent2);color:var(--accent);padding:6px 13px;border-radius:8px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;font-family:inherit;white-space:nowrap">&#x2295; Load Photos</button>
        <input type="file" id="photo-file-input" accept="image/*" multiple style="display:none">
      </div>
    </div>
    <div class="filter-row" id="board-cat-row" style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="dark">Dark / Minimal</button>
      <button class="filter-btn" data-filter="tonal">Tonal</button>
      <button class="filter-btn" data-filter="contrast">Contrast</button>
      <button class="filter-btn" data-filter="night">Night Out</button>
    </div>
    <div class="filter-row" id="board-persona-row" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
      <button class="filter-btn pf-btn active" data-pfilter="all">All Characters</button>
      <button class="filter-btn pf-btn" data-pfilter="overlord">Overlord</button>

// STATE

// Bump DATA_VERSION any time OUTFITS_DEFAULT or WORN_HISTORY_DEFAULT
// changes in this file (new outfits, fixed photos, edited entries, etc).
// On a version bump, the file's bundled defaults take priority over
// whatever is cached in localStorage, so updates always show up without
// needing to manually clear browser storage. Anything genuinely created
// in-app (outfits/wears not present in the bundled defaults) is preserved.

// Safe parse — never throws even if localStorage has "undefined" or malformed JSON
// Mutable wardrobe state — loaded/merged/persisted through the shared store (store.js).
// These stay live `let`s mutated in place across tabs; the store only centralizes the
// version-checked load and the localStorage writes.
const _st = Store.load();
let outfits     = _st.outfits;
let wornHistory = _st.wornHistory;
let customItems = _st.customItems;
let items       = _st.items;

function persist() {

// bkey() now provided by data.js (shared)

// ── OUTFIT PHOTOS ──
let OUTFIT_PHOTOS = {};
// Proposal outfit photos — loaded from outfits/ subfolder
const PROPOSAL_PHOTO_PATHS = {};
// Outfit IDs that have a board photo — shared list (data.js OUTFIT_PHOTO_IDS).
OUTFIT_PHOTO_IDS.forEach(id => { PROPOSAL_PHOTO_PATHS[id] = outfitPhotoPath(id); });
// Pre-populate OUTFIT_PHOTOS with proposal paths (relative to HTML file)
Object.entries(PROPOSAL_PHOTO_PATHS).forEach(([id, path]) => {
  if (!OUTFIT_PHOTOS[parseInt(id)]) OUTFIT_PHOTOS[parseInt(id)] = path;
});
const IDB = {
  _db: null,
  async open() {
    if (this._db) return this._db;
    return new Promise((res, rej) => {
      const req = indexedDB.open("outfitBoardPhotos", 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore("photos");
      req.onsuccess = e => { this._db = e.target.result; res(this._db); };
      req.onerror = rej;
    });
  },
  async put(id, blob) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").put(blob, id);
      tx.oncomplete = res; tx.onerror = rej;
    });
  },
  async getAll() {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("photos", "readonly");
      const out = {};
      tx.objectStore("photos").openCursor().onsuccess = e => {
        const c = e.target.result;
        if (c) { out[c.key] = c.value; c.continue(); } else res(out);
      };
      tx.onerror = rej;
    });
  }
};
async function initPhotos() {
  try {
    const stored = await IDB.getAll();
    let count = 0;
    Object.entries(stored).forEach(([id, blob]) => {
      OUTFIT_PHOTOS[parseInt(id)] = URL.createObjectURL(blob);
      count++;
    });
    if (count > 0) renderGrid();
  } catch(e) {}
}
// Bulk load button
document.getElementById("btn-load-photos").addEventListener("click", function() {

document.getElementById("photo-file-input").addEventListener("change", async function() {
  var files = this.files;
  var matched = 0;
  var saves = [];
  Array.from(files).forEach(function(f) {
    var m = f.name.match(/(?:wardrobe_)?outfit_(\d+)\.(jpg|jpeg|png|webp)/i)
           || f.name.match(/outfit[_\s-]?(\d+)\.(jpg|jpeg|png|webp)/i)
           || f.name.match(/(\d+)\.(jpg|jpeg|png|webp)/i);
    if (m) {
      var num = parseInt(m[1]);
      if (num >= 1 && num <= 99) {
        if (OUTFIT_PHOTOS[num]) URL.revokeObjectURL(OUTFIT_PHOTOS[num]);
        OUTFIT_PHOTOS[num] = URL.createObjectURL(f);
        saves.push(IDB.put(num, f));
        matched++;
      }
    }
  });
  await Promise.all(saves);
  if (matched > 0) {
    renderGrid();
    var btn = document.getElementById("btn-load-photos");
    btn.textContent = "\u2713 " + matched + " Photos";
    btn.style.borderColor = "#4a8c5a";
    btn.style.color = "#6abc7e";
  } else {
    var btn = document.getElementById("btn-load-photos");
    btn.textContent = "No matches found";
    setTimeout(function() { btn.textContent = "\u2295 Load Photos"; btn.style.borderColor=""; btn.style.color=""; }, 2500);
  }
  this.value = "";
});

function buildSidebar() {
  const el = document.getElementById("sidebar");
  const keyFn = {
    brand: item => item.brand,
    type:  item => item.cat || item.type,
    color: item => item.color || "Unknown",
    style: item => item.style || "—",
  }[sidebarSort];

  const orderMap = {
    brand: ["ORTTU","MINOAR","RYVK","FRKM","YASAR","ARAHANT"],
    type:  ["Shirt","Top","Cardigan","Vest","Jacket","Coat","Pants","Trousers","Skirt","Skirt-Trouser","Robe","Boots"],
    color: null,
    style: ["Dark / Minimal","Tonal","Contrast","Night Out","—"],
  };

  const grouped = {};
  items.forEach(item => { const k = keyFn(item); if (!grouped[k]) grouped[k] = []; grouped[k].push(item); });
  let keys = (orderMap[sidebarSort] || []).filter(k => grouped[k]);
  Object.keys(grouped).forEach(k => { if (!keys.includes(k)) keys.push(k); });

  let html = "";
  keys.forEach(key => {
    const bk = bkey(key);
    const b = BRANDS[bk] || {};
    const displayKey = sidebarSort === "brand" ? (b.label || key) : key;
    html += "<div class='sidebar-section'><div class='sidebar-section-header'>" + displayKey + "</div>";
    (grouped[key] || []).forEach(item => {
      const ibk = bkey(item.brand);
      const ib = BRANDS[ibk] || { dot:"", label: item.brand };
      const img = IMAGES[item.name] || (item.img) || "";
      const itemPersona = getItemPersona(item);
      const itemPersonaLabel = itemPersona ? PERSONA_LABELS[itemPersona] : "";
      html += "<div class='wardrobe-item' data-name='" + item.name + "' data-brand='" + item.brand + "' draggable='true'>" +
        "<div class='item-thumb'>" + (img ? "<img src='" + img + "' alt='" + item.name + "' loading='lazy'>" : "<div class='item-thumb-empty'></div>") + "</div>" +
        "<div class='item-info'><div class='item-name'>" + item.name + "</div><div class='item-meta' style='display:flex;align-items:center;gap:5px;flex-wrap:wrap'>" + (item.color||"—") + " · " + (item.size||"—") + (itemPersonaLabel ? "<span style='background:var(--accent);color:#111;font-size:8px;padding:1px 5px;border-radius:4px;letter-spacing:0.06em;font-weight:600;text-transform:uppercase;white-space:nowrap'>" + itemPersonaLabel + "</span>" : "") + "</div></div>" +
        "<div class='item-dot " + ib.dot + "' style='margin-left:auto;flex-shrink:0'></div>" +
        "</div>";
    });
    html += "</div>";
  });
  el.innerHTML = html;

  el.querySelectorAll(".wardrobe-item").forEach(itemEl => {
    itemEl.addEventListener("click", () => showPreview(itemEl.dataset.name, itemEl.dataset.brand));
    itemEl.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", JSON.stringify({name: itemEl.dataset.name, brand: itemEl.dataset.brand})));
  });
}

function renderGrid() {
  const grid = document.getElementById("outfits-grid");
  // Proposed outfits live on the Proposals page until photographed — hide them here.
  const boardOutfits = outfits.filter(o => o.source !== "proposed");
  let filtered = boardOutfits;
  if (currentFilter !== "all") filtered = boardOutfits.filter(o => outfitFilterTags(o).has(currentFilter));
  if (currentPersonaFilter !== "all") filtered = filtered.filter(o => o.persona === currentPersonaFilter);
  // Facet filters (shared FacetFilter component) — filter by the outfit's effective stats.
  if (boardFacetCtl && boardFacetCtl.active()) filtered = filtered.filter(o => boardFacetCtl.matches(getOutfitStats(o)));

  // Always display outfits in ascending number (id) order
  filtered = [...filtered].sort((a, b) => a.id - b.id);

  document.getElementById("outfit-count-label").textContent = filtered.length + " Outfit" + (filtered.length !== 1 ? "s" : "");
  if (typeof syncBoardFilterCount === "function") syncBoardFilterCount();

  if (filtered.length === 0) {
    grid.innerHTML = "<div class='empty-card'>No outfits match this filter.</div>";
    return;
  }

  grid.classList.remove("horizontal", "card-view");
  if (outfitViewMode === "horizontal") {
    grid.classList.add("horizontal");
    grid.innerHTML = filtered.map(renderHorizontalCard).join("");
  } else if (outfitViewMode === "card") {
    grid.classList.add("card-view");
    grid.innerHTML = filtered.map(renderCardViewCard).join("");
    grid.querySelectorAll(".outfit-card.card-view").forEach(card => {
      card.addEventListener("click", () => openOutfitDetail(parseInt(card.dataset.id)));
    });
    return;
  }
  if (outfitViewMode === "horizontal") {
    // wire clicks for horizontal cards
    grid.querySelectorAll(".piece-name-link").forEach(el => {
      el.addEventListener("click", e => { e.stopPropagation(); openItemDetail(el.dataset.name, el.dataset.brand); });
    });
    grid.querySelectorAll(".outfit-card").forEach(card => {
      card.addEventListener("click", e => {
        if (e.target.closest(".piece-name-link")) return;
        openOutfitDetail(parseInt(card.dataset.id));
      });
    });
    return;
  }
  // Shared grid card builder (data.js). One source across Outfits + Today.
  grid.innerHTML = filtered.map(outfit =>
    outfitCardHtml(outfit, { view: "grid", photo: OUTFIT_PHOTOS[outfit.id] || PROPOSAL_PHOTO_PATHS[outfit.id] || "" })
  ).join("");

  grid.querySelectorAll(".piece-name-link").forEach(el => {
    el.addEventListener("click", e => { e.stopPropagation(); openItemDetail(el.dataset.name, el.dataset.brand); });
  });
  // Click anywhere on card → outfit detail
  grid.querySelectorAll(".outfit-card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".piece-name-link")) return;
      openOutfitDetail(parseInt(card.dataset.id));
    });
  });
}

function getOutfitStats(outfit) {
  // Effective stats (base + styling modifiers + combos). Engine lives in data.js.
  if (typeof effectiveOutfitStats === "function") return effectiveOutfitStats(outfit);
  const STAT_KEYS = ["drama","structure","skin","edge","formality"];
  const totals = {drama:0,structure:0,skin:0,edge:0,formality:0};
  let count = 0;
  outfit.pieces.forEach(p => {
    const item = itemForPiece(p);
    if (!item || !item.stats) return;
    STAT_KEYS.forEach(k => { totals[k] += item.stats[k]; });
    count++;
  });
  if (!count) return null;
  const avg = {};
  STAT_KEYS.forEach(k => { avg[k] = Math.round((totals[k]/count)*10)/10; });
  return avg;
}

}

function getEntryPhotos(w) {
  const outfit = w.outfitId != null ? outfits.find(o => o.id === w.outfitId) : null;
  const generated = outfit ? (OUTFIT_PHOTOS[outfit.id] || null) : null;
  const main = generated || w.photo || "";
  const attached = (generated && w.photo && generated !== w.photo) ? w.photo : null;
  return { main: main, attached: attached, outfit: outfit };
}
