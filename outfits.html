<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alter — Wardrobe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20C33 20 29 38 31 56C33 74 42 84 50 84C58 84 67 74 69 56C71 38 67 20 50 20Z' fill='%23e2d3b4'/></svg>">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e4df;
    --muted: #6b6b6b;
    --accent: #e2d3b4;
    --accent2: #c9b98f;
    --white: #f5f2ee;
    --green: var(--success, #2e7d32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }


  /* ── TAB PANELS ── */
  /* Cap the workspace to the shared page width so Outfits/Wardrobe/Builder/History
     line up with every other page (Today, Shop, etc.). Nav stays full-width. */
  .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; width: 100%; max-width: var(--page-max); margin: 0 auto; }
  .tab-panel.active { display: flex; }

  /* ── ORIGINAL OUTFIT BOARD STYLES (preserved exactly) ── */
  header.board-header {
    background: #000;
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
  }
  /* .filter-btn / .pf-btn styling is shared (alter-theme.css filter/context chip) */
  .container { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding-bottom: 32px;
  }
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #111;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  .sidebar-tab {
    flex: 1;
    padding: 9px 4px;
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sidebar-section { border-bottom: 1px solid var(--border); }
  .sidebar-section-header {
    padding: 12px 16px 10px;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    background: #111;
    position: sticky;
    top: 37px;
    z-index: 2;
  }
  .wardrobe-item {
    padding: 6px 12px;
    border-bottom: 1px solid rgba(42,42,42,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: background 0.1s;
    user-select: none;
  }
  .wardrobe-item:hover { background: var(--surface2); }
  .item-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .item-thumb {
    width: 32px;
    height: 40px;
    flex-shrink: 0;
    border-radius:6px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .item-thumb-empty { width: 100%; height: 100%; background: var(--surface2); }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .item-meta { font-size: 9px; color: var(--muted); margin-top: 1px; }
  .item-tag { font-size: 8px; padding: 2px 5px; border-radius:6px; letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0; font-weight: 600; }
  .canvas-area { flex: 1; overflow-y: auto; padding: 28px 28px 60px; background: var(--bg); }
  .canvas-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .canvas-top h2 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .btn-add {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 7px 16px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    border-radius:6px;
    transition: opacity 0.15s;
    font-family: inherit;
  }
  .btn-add:hover { opacity: 0.85; }
  .outfits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  /* Outfit card base/header/pieces CSS now single-sourced in alter-theme.css (scoped .outfit-card …).
     Only rules alter-theme lacks or intentionally differs on are kept inline below. */
  .outfit-card:hover { border-color: var(--accent2); }
  .outfit-number { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 2px; }
  .outfit-name { font-size: 13px; font-weight: 600; color: var(--white); letter-spacing: 0.02em; }
  .outfit-vibe { font-size: 10px; color: var(--accent); margin-top: 4px; font-style: italic; }
  .outfit-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .action-btn { background: none; border: 1px solid var(--border); color: var(--muted); width: 26px; height: 26px; border-radius:6px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.saved { border-color: var(--green); color: var(--green); }
  /* .outfit-pieces / .piece-row / .piece-thumb* / .piece-role now single-sourced in alter-theme.css (scoped) */
  .piece-name { font-size: 11px; color: var(--text); flex: 1; cursor: pointer; }
  .piece-name:hover { color: var(--white); text-decoration: underline; text-decoration-color: var(--accent); }
  /* Brand dots (used via BRANDS[..].dot on .item-dot) */
  .dot-orttu { background: #4a6fa5; } .dot-minoar { background: #7c6f5e; } .dot-ryvk { background: #9b4a4a; }
  .dot-frkm { background: #6b5a3e; } .dot-yasar { background: #3d3d3d; } .dot-arahant { background: #7a3040; }
  .empty-card { border: 1px dashed var(--border); border-radius:8px; padding: 40px 24px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.7; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius:8px; }
  .separator { height: 1px; background: var(--border); margin: 4px 0; }

  /* ── PREVIEW PANEL (original) ── */
  .preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; display: none; align-items: center; justify-content: center; }
  .preview-overlay.open { display: flex; }
  .preview-panel { background: var(--surface); border: 1px solid var(--border); display: flex; max-width: 700px; width: 92%; max-height: 88vh; overflow: hidden; }
  .preview-img-wrap { width: 300px; min-width: 300px; background: var(--surface2); overflow: hidden; }
  .preview-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview-no-img { width: 100%; height: 100%; min-height: 420px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: var(--muted); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .preview-info { padding: 32px 28px; flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  .preview-close-btn { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 0; line-height: 1; align-self: flex-end; margin-bottom: 20px; font-family: inherit; }
  .preview-close-btn:hover { color: var(--white); }
  .preview-brand-link { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); text-decoration: none; margin-bottom: 10px; display: block; }
  .preview-brand-link:hover { color: var(--white); }
  .preview-item-name { font-size: 16px; color: var(--white); line-height: 1.35; margin-bottom: 20px; }
  .preview-item-meta { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; display: flex; flex-direction: column; gap: 6px; }
  .preview-item-meta .meta-row { display: flex; gap: 8px; }
  .preview-item-meta .meta-label { color: #3a3a3a; min-width: 52px; text-transform: uppercase; font-size: 9px; letter-spacing: 0.1em; padding-top: 1px; }
  .piece-name-link { cursor: pointer; transition: color 0.12s; }
  .piece-name-link:hover { color: var(--white); text-decoration: underline; text-decoration-color: var(--accent); }

  /* ── MODAL (original) ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 600; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius:8px; width: 440px; max-width: 95vw; padding: 24px; }
  .modal h3 { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white); margin-bottom: 20px; }
  .modal input, .modal textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; font-size: 12px; border-radius:6px; margin-bottom: 12px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal-footer { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .btn-cancel { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 16px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius:6px; font-family: inherit; }
  .btn-cancel:hover { border-color: var(--text); color: var(--text); }

  /* ── WARDROBE MANAGER TAB ── */
  .mgr-toolbar { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #111; flex-shrink: 0; }
  .mgr-toolbar .view-toggle { margin-left: auto; }
  /* item card view */
  .mgr-items.card-view { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .mgr-items.card-view .mgr-item { position: relative; aspect-ratio: 3/4; flex-direction: column; overflow: hidden; background: var(--surface2); }
  .mgr-items.card-view .mgr-item-img { height: 100%; position: absolute; inset: 0; flex-shrink: unset; }
  .mgr-items.card-view .mgr-item-img img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .mgr-items.card-view .mgr-item-info { display: none; }
  .mgr-items.card-view .mgr-item-cv { display: block; }
  .mgr-item-cv { display: none; position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.82)); padding: 30px 10px 10px; }
  .mgr-item-cv-brand { font-size: 8px; letter-spacing: 0.14em; color: rgba(255,255,255,0.45); text-transform: uppercase; margin-bottom: 2px; }
  .mgr-item-cv-name { font-size: 12px; font-weight: 600; color: var(--white); line-height: 1.2; }
  /* item editorial view */
  .mgr-items.editorial-view { grid-template-columns: 1fr; gap: 8px; }
  .mgr-items.editorial-view .mgr-item { flex-direction: row; }
  .mgr-items.editorial-view .mgr-item-img { width: 120px; min-width: 120px; height: 150px; flex-shrink: 0; border-right: 1px solid var(--border); }
  .mgr-items.editorial-view .mgr-item-cv { display: none; }
  .mgr-search { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 12px; padding: 7px 11px; outline: none; border-radius:8px; flex: 1; min-width: 140px; }
  .mgr-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 11px; padding: 7px 10px; border-radius:8px; outline: none; }
  .mgr-body { flex: 1; display: flex; overflow: hidden; }
  .mgr-grid-wrap { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .mgr-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .mgr-item { background: var(--surface); border: 1px solid var(--border); border-radius:8px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; display: flex; flex-direction: column; }
  .mgr-item:hover { border-color: var(--accent2); }
  .mgr-item.selected { border-color: var(--accent); }
  .mgr-item-img { height: 320px; background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .mgr-item-img img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .mgr-item-info { padding: 12px 14px 14px; }
  .mgr-item-brand { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .mgr-item-name { font-size: 13px; color: var(--text); line-height: 1.3; margin-bottom: 8px; font-weight: 500; }
  .mgr-tag { font-size: 8px; padding: 2px 6px; border: 1px solid var(--border); color: var(--muted); border-radius:6px; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px; }
  .mgr-form-panel { width: 300px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .mgr-form-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .mgr-form-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white); }
  .mgr-form-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; font-family: inherit; }
  .mgr-form-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .mgr-preview-img { height: 160px; background: var(--surface2); border-radius:8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .mgr-preview-img img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .mgr-field { display: flex; flex-direction: column; gap: 5px; }
  .mgr-field label { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .mgr-field input, .mgr-field select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 12px; padding: 8px 10px; outline: none; border-radius:6px; }
  .mgr-field input:focus, .mgr-field select:focus { border-color: var(--accent); }
  .mgr-form-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .mgr-btn { border: none; font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; padding: 9px 14px; cursor: pointer; border-radius:6px; }
  .mgr-btn-save { background: var(--accent); color: #000; }
  .mgr-btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); }
  .mgr-btn-danger { background: var(--danger-tint); border: 1px solid var(--danger-strong); color: var(--danger); }

  /* ── BUILDER MODE TOGGLE ── */
  .builder-mode-bar { display:flex; border-bottom:1px solid var(--border); background:#000; flex-shrink:0; }
  .builder-mode-btn { background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); font-family:inherit; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; padding:0 20px; height:40px; cursor:pointer; transition:all 0.15s; }
  .builder-mode-btn:hover { color:var(--text); }
  .builder-mode-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* ── CLOSET VIEW ── */
  .closet-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .closet-layout { flex:1; display:flex; overflow:hidden; }

  /* Left panel: spider + stats + save */
  .closet-left { flex:0 0 50%; min-width:380px; max-width:640px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--surface); padding:24px 26px 20px; overflow-y:auto; }
  .closet-spider-wrap { display:flex; justify-content:center; margin-bottom:20px; }
  .closet-stat-list { display:flex; flex-direction:column; gap:10px; flex:1; }
  .closet-stat { display:flex; align-items:center; gap:8px; }
  .closet-stat-name { font-size:8px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); min-width:68px; }
  .closet-stat-track { flex:1; height:2px; background:var(--surface2); border-radius:6px; overflow:hidden; }
  .closet-stat-fill { height:100%; background:var(--accent); border-radius:6px; transition:width 0.35s; }
  .closet-stat-val { font-size:10px; color:var(--accent); font-weight:600; min-width:20px; text-align:right; }
  .closet-left-footer { margin-top:24px; display:flex; flex-direction:column; gap:10px; }
  .closet-saved-toast { font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); opacity:0; transition:opacity 0.3s; text-align:center; }
  .closet-saved-toast.show { opacity:1; }
  .closet-save-btn { background:var(--accent); border:none; color:#000; font-family:inherit; font-size:10px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; padding:13px; cursor:pointer; width:100%; transition:opacity 0.15s; }
  .closet-save-btn:hover { opacity:0.85; }

  /* Right panel: picker — primary (top/bottom) stacked & larger, supportive (outer/shoes) smaller beside */
  /* Fill the available height so all four toggles are visible without scrolling:
     columns stretch to the panel height, cards share their column's height. */
  .closet-right { flex:1; display:flex; flex-direction:row; align-items:stretch; gap:14px; overflow:hidden; min-height:0; background:var(--bg); padding:14px; }
  .closet-col { display:flex; flex-direction:column; gap:14px; min-width:0; min-height:0; }
  .closet-col-primary { flex:1.6; }
  .closet-col-support { flex:1; }
  .closet-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; display:flex; flex-direction:column; overflow:hidden; transition:border-color 0.2s, opacity 0.2s; flex:1 1 0; min-height:0; }
  .closet-card.support.optional { opacity:0.5; }
  .closet-card.support.optional.on { opacity:1; }
  .closet-card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; border-bottom:1px solid var(--border); }
  .closet-card-role { font-size:8px; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); }
  .closet-card-photo { position:relative; flex:1; min-height:110px; background:var(--surface2); }
  .closet-card-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .cc-arrow { position:absolute; top:0; bottom:0; width:38px; display:flex; align-items:center; justify-content:center; border:none; color:#fff; font-size:22px; cursor:pointer; background:rgba(0,0,0,0.28); transition:background 0.15s; z-index:2; }
  .cc-arrow:hover { background:rgba(0,0,0,0.5); }
  .cc-arrow.left { left:0; } .cc-arrow.right { right:0; }
  .cc-arrow:disabled { opacity:0.15; cursor:default; background:rgba(0,0,0,0.15); }
  .closet-card-info { padding:10px 12px 12px; }
  .cc-name { color:var(--white); font-weight:500; font-size:13px; line-height:1.25; margin-bottom:3px; }
  .closet-card.support .cc-name { font-size:11px; }
  .cc-brand { font-size:8px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .cc-counter { font-size:9px; color:var(--muted); letter-spacing:0.06em; }
  .closet-no-img { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--border); font-size:24px; }
  .closet-toggle { width:28px; height:16px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); cursor:pointer; position:relative; transition:background 0.2s; flex-shrink:0; }
  .closet-toggle::after { content:''; position:absolute; top:3px; left:3px; width:8px; height:8px; border-radius:50%; background:var(--muted); transition:left 0.2s, background 0.2s; }
  .closet-card.optional.on .closet-toggle { background:rgba(226, 211, 180,0.2); border-color:var(--accent); }
  .closet-card.optional.on .closet-toggle::after { left:13px; background:var(--accent); }

  /* ── BUILDER TAB ── */
  .builder-layout { display:flex; overflow:hidden; height:calc(100vh - 96px); }
  .builder-left { width:260px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; padding:12px; overflow:hidden; background:var(--surface); gap:8px; height:100%; }
  .builder-section-title { font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .builder-piece-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; min-height:0; }
  .builder-piece-row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; cursor:pointer; border:1px solid transparent; transition:all 0.15s; }
  .builder-piece-row:hover { background:var(--surface2); border-color:var(--border); }
  .builder-piece-row.selected { border-color:var(--accent); background:rgba(226, 211, 180,0.08); }
  .builder-piece-thumb { width:44px; height:56px; flex-shrink:0; border-radius:6px; overflow:hidden; background:var(--surface2); border:1px solid var(--border); }
  .builder-piece-thumb img { width:100%; height:100%; object-fit:cover; object-position:top center; }

  /* horizontal/editorial + h-piece + view-toggle + card-view CSS now shared in alter-theme.css */

  /* ══════════════════════════════════════
     MOBILE RESPONSIVE — max-width 768px
  ══════════════════════════════════════ */
  @media (max-width: 768px) {
    /* BOARD HEADER */
    .board-header { padding: 10px 16px; flex-direction: column; align-items: flex-start; gap: 6px; }
    .filter-btn { padding: 6px 10px; font-size: 10px; }
    .btn-add, #btn-load-photos { padding: 6px 12px; font-size: 10px; }

    /* FILTER ROWS — scroll horizontally, no wrap */
    .filter-row { flex-wrap: nowrap !important; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; margin-top: 0 !important; }
    .filter-row::-webkit-scrollbar { display: none; }

    /* STAT FILTER ROW */
    .stat-filter-row { padding: 8px 16px; gap: 6px; overflow-x: auto; flex-wrap: nowrap; }
    .stat-range { width: 50px; }

    /* SIDEBAR — hide on mobile */
    .sidebar { display: none !important; }

    /* MAIN LAYOUT */
    .container { height: auto; }
    .canvas-area { padding: 16px 12px 40px; }
    .canvas-top { margin-bottom: 12px; }

    /* OUTFIT GRID — 2 columns on tablet */
    .outfits-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }

    /* OUTFIT CARD VERTICAL */
    .outfit-card.horizontal { flex-direction: column; height: auto; min-height: unset; }
    .outfit-card.horizontal .outfit-photo {
      width: 100% !important; min-width: unset !important; max-width: unset !important;
      aspect-ratio: 4/5; border-right: none; border-bottom: 1px solid var(--border);
    }
    .h-pieces-row { gap: 8px; padding: 12px 14px; }
    .h-piece-card { width: 120px; }
    .h-piece-img { width: 120px; height: 148px; }
    .outfit-card-horizontal-right { width: 100%; }
    .outfit-card.horizontal .outfit-card-header { padding: 14px 16px 10px; }

    /* OUTFIT CARD VERTICAL (grid view) */
    .outfit-photo { aspect-ratio: 3/4; }
    .piece-row { gap: 6px; }
    .piece-role { width: 40px; font-size: 7px; }

    /* VIEW TOGGLE */
    .view-toggle { margin-left: auto; }

    /* WARDROBE TAB */
    .mgr-toolbar { padding: 10px 14px; gap: 8px; }
    .mgr-search { font-size: 14px; } /* prevent iOS zoom */
    .mgr-items { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .mgr-item-img { height: 200px; }
    .mgr-form-panel { position: fixed; inset: 0; width: 100%; z-index: 500; border-radius: 0; }

    /* BUILDER TAB — stack left panel above right */
    .builder-layout { flex-direction: column; height: auto; min-height: unset; overflow: visible; }
    #builder-suggest-view { flex-direction: column; overflow: visible; }
    .builder-left { width: 100% !important; height: auto; max-height: 220px; border-right: none; border-bottom: 1px solid var(--border); overflow: hidden; }
    .builder-piece-list { overflow-y: auto; }
    .builder-right { height: auto; min-height: 50vh; overflow-y: auto; padding: 16px; }

    /* CLOSET VIEW — stack left panel above right */
    .closet-view { overflow: auto; }
    .closet-layout { flex-direction: column; overflow: visible; }
    .closet-left { flex: 0 0 auto !important; width: 100% !important; min-width: 0 !important; max-width: none !important; border-right: none; border-bottom: 1px solid var(--border); padding: 16px 20px; }
    .closet-right { padding: 12px; flex-direction: column; overflow: visible; }
    .closet-col-primary, .closet-col-support { flex: 1 1 auto; }
    /* Stacked + scrolling on mobile: cards size by content, photos use their aspect ratio again */
    .closet-card { flex: 0 0 auto; }
    .closet-card-photo { flex: none; aspect-ratio: 3/4; min-height: 0; }

    /* ITEM DETAIL MODAL */

// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════
// Fuzzy image lookup - tries exact match first, then partial

// Wear history — logged from confirmed photo uploads (chat-assisted detection pilot)
// wearCounts are DERIVED from this array at runtime, not stored redundantly on items/outfits
// WORN_HISTORY_DEFAULT + getWearCount / getLastWorn / fmtDate now provided by data.js (shared wear store).
// Style lookup — reads directly from item.style field
const PIECE_STYLES = (() => {
  const map = {};
  WARDROBE_DATA.forEach(item => { if (item.style) map[item.name] = new Set([item.style]); });
  return map;
})();

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
// Bump DATA_VERSION any time OUTFITS_DEFAULT or WORN_HISTORY_DEFAULT
// changes in this file (new outfits, fixed photos, edited entries, etc).
// On a version bump, the file's bundled defaults take priority over
// whatever is cached in localStorage, so updates always show up without
// needing to manually clear browser storage. Anything genuinely created
// in-app (outfits/wears not present in the bundled defaults) is preserved.

// Safe parse — never throws even if localStorage has "undefined" or malformed JSON
// Mutable wardrobe state — loaded/merged/persisted through the shared store (store.js).
// These stay live `let`s mutated in place across tabs; the store only centralizes the
// version-checked load and the localStorage writes.
const _st = Store.load();
let outfits     = _st.outfits;
let wornHistory = _st.wornHistory;
let customItems = _st.customItems;
let items       = _st.items;


let currentFilter = "all";
let currentPersonaFilter = "all";
let sidebarSort   = "brand";
let mgrEditingId  = null;

function persist() {
  Store.persist({ outfits: outfits, customItems: customItems, wornHistory: wornHistory });
  items = Store.mergeItems(customItems);
  document.getElementById("nav-stat").textContent = items.length + " pieces · " + outfits.filter(o => o.source !== "proposed").length + " outfits";
}

// bkey() now provided by data.js (shared)

// ── OUTFIT PHOTOS ──
let OUTFIT_PHOTOS = {};
// Proposal outfit photos — loaded from outfits/ subfolder
const PROPOSAL_PHOTO_PATHS = {};
// Outfit IDs that have a board photo — shared list (data.js OUTFIT_PHOTO_IDS).
OUTFIT_PHOTO_IDS.forEach(id => { PROPOSAL_PHOTO_PATHS[id] = outfitPhotoPath(id); });
// Pre-populate OUTFIT_PHOTOS with proposal paths (relative to HTML file)
Object.entries(PROPOSAL_PHOTO_PATHS).forEach(([id, path]) => {
  if (!OUTFIT_PHOTOS[parseInt(id)]) OUTFIT_PHOTOS[parseInt(id)] = path;
});
const IDB = {
  _db: null,
  async open() {
    if (this._db) return this._db;
    return new Promise((res, rej) => {
      const req = indexedDB.open("outfitBoardPhotos", 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore("photos");
      req.onsuccess = e => { this._db = e.target.result; res(this._db); };
      req.onerror = rej;
    });
  },
  async put(id, blob) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").put(blob, id);
      tx.oncomplete = res; tx.onerror = rej;
    });
  },
  async getAll() {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("photos", "readonly");
      const out = {};
      tx.objectStore("photos").openCursor().onsuccess = e => {
        const c = e.target.result;
        if (c) { out[c.key] = c.value; c.continue(); } else res(out);
      };
      tx.onerror = rej;
    });
  }
};
async function initPhotos() {
  try {
    const stored = await IDB.getAll();
    let count = 0;
    Object.entries(stored).forEach(([id, blob]) => {
      OUTFIT_PHOTOS[parseInt(id)] = URL.createObjectURL(blob);
      count++;
    });
    if (count > 0) renderGrid();
  } catch(e) {}
}
// Bulk load button
document.getElementById("btn-load-photos").addEventListener("click", function() {
  document.getElementById("photo-file-input").click();
});
document.getElementById("photo-file-input").addEventListener("change", async function() {
  var files = this.files;
  var matched = 0;
  var saves = [];
  Array.from(files).forEach(function(f) {
    var m = f.name.match(/(?:wardrobe_)?outfit_(\d+)\.(jpg|jpeg|png|webp)/i)
           || f.name.match(/outfit[_\s-]?(\d+)\.(jpg|jpeg|png|webp)/i)
           || f.name.match(/(\d+)\.(jpg|jpeg|png|webp)/i);
    if (m) {
      var num = parseInt(m[1]);
      if (num >= 1 && num <= 99) {
        if (OUTFIT_PHOTOS[num]) URL.revokeObjectURL(OUTFIT_PHOTOS[num]);
        OUTFIT_PHOTOS[num] = URL.createObjectURL(f);
        saves.push(IDB.put(num, f));
        matched++;
      }
    }
  });
  await Promise.all(saves);
  if (matched > 0) {
    renderGrid();
    var btn = document.getElementById("btn-load-photos");
    btn.textContent = "\u2713 " + matched + " Photos";
    btn.style.borderColor = "#4a8c5a";
    btn.style.color = "#6abc7e";
  } else {
    var btn = document.getElementById("btn-load-photos");
    btn.textContent = "No matches found";
    setTimeout(function() { btn.textContent = "\u2295 Load Photos"; btn.style.borderColor=""; btn.style.color=""; }, 2500);
  }
  this.value = "";
});

function openItemDetail(name, brand) {
  const bk = bkey(brand || "");
  const item = items.find(i => i.name === name);
  const b = BRANDS[bk] || { label: brand || "" };
  const imgUrl = IMAGES[name] || (item && item.img) || "";

  // Photo (shared builder)
  document.getElementById("item-detail-photo").innerHTML =
    (item && typeof itemDetailPhotoHtml === "function")
      ? itemDetailPhotoHtml(item)
      : (imgUrl ? "<img src='" + imgUrl + "' alt='" + name + "'>" : "<div class='item-detail-photo-empty'>" + (bk.slice(0,2)||"") + "</div>");

  // Outfits-containing + pairings + tags are now computed inside the shared itemDetailInfoHtml (data.js).

  const wearHtml = item ? wearBlockHtml("item", item.id, { interactive:true, outfitPhoto:function(id){ return OUTFIT_PHOTOS[id] || PROPOSAL_PHOTO_PATHS[id] || (outfitPhotoPath(id)); } }) : "";

  document.getElementById("item-detail-info").innerHTML = (item && typeof itemDetailInfoHtml === "function")
    ? itemDetailInfoHtml(item, {

        wearHtml: wearHtml,
        outfitPhoto: function(id){ return OUTFIT_PHOTOS[id] || PROPOSAL_PHOTO_PATHS[id] || (outfitPhotoPath(id)); }
      })

  // Wire outfit chip clicks → open outfit detail
  document.getElementById("item-detail-info").querySelectorAll("[data-outfit-id]").forEach(function(chip) {

  // Wire pair card clicks
  document.getElementById("item-detail-info").querySelectorAll(".pair-card").forEach(function(card) {

  document.getElementById("item-detail-overlay").style.display = "flex";
}

// One delegated handler for every shared wear block (.wear-last-worn-link) — no per-popup wiring.
document.addEventListener("click", function(e){

function openOutfitDetail(outfitId) {
  // If outfit has a photo, use the lightbox
  if (OUTFIT_PHOTOS[outfitId]) {
    openLightbox(outfitId);
    return;
  }
  // Otherwise show outfit info in the item-detail-overlay panel
  var outfit = outfits.find(function(o){ return o.id === outfitId; });
  if (!outfit) return;

  // Photo side + info side from the shared builders (data.js)
  document.getElementById("item-detail-photo").innerHTML = outfitDetailPhotoHtml(outfit);
  const wearHtml = wearBlockHtml("outfit", outfit.id, { interactive:true, outfitPhoto:function(id){ return OUTFIT_PHOTOS[id] || PROPOSAL_PHOTO_PATHS[id] || (outfitPhotoPath(id)); } });
  document.getElementById("item-detail-info").innerHTML = outfitDetailInfoHtml(outfit, { wearHtml: wearHtml, note: "Click the photo slot on the card to add an outfit photo." });

  // Wire piece clicks within the panel
  document.getElementById("item-detail-info").querySelectorAll(".outfit-detail-piece").forEach(function(el) {

function openLightbox(outfitId) {
  var outfit = outfits.find(function(o){ return o.id === outfitId; });
  if (!outfit || !OUTFIT_PHOTOS[outfitId]) return;
  document.getElementById("photo-lightbox-img").src = OUTFIT_PHOTOS[outfitId];

      "</div>";

  const lbStats = getOutfitStats(outfit);
  const lbWearHtml = wearBlockHtml("outfit", outfit.id, { interactive:true, outfitPhoto:function(id){ return OUTFIT_PHOTOS[id] || PROPOSAL_PHOTO_PATHS[id] || (outfitPhotoPath(id)); } });
  document.getElementById("photo-lightbox-info").innerHTML =
    "<div class='lb-outfit-num'>No. " + String(outfit.id).padStart(2,"0") + (outfit.source==="detected"?" &middot; Auto-detected":"") + "</div>" +
    "<div class='lb-outfit-name'>" + outfit.name + "</div>" +

      (outfit.persona ? "<span style='background:var(--accent);color:#111;font-size:8px;padding:2px 6px;border-radius:4px;letter-spacing:0.06em;font-weight:700;text-transform:uppercase'>" + (PERSONA_LABELS[outfit.persona]||outfit.persona) + "</span>" : "") +
    "</div>" +
    lbWearHtml +
    outfitStatsCompareHtml(outfit) +
    "<div class='lb-pieces-title'>Pieces</div>" + piecesHtml;
  document.getElementById("photo-lightbox").style.display = "flex";
  // Last-worn link handled by the shared delegated handler (.wear-last-worn-link).
  // Wire piece clicks in lightbox
  document.getElementById("photo-lightbox-info").querySelectorAll(".lb-piece-row").forEach(function(row) {
    row.style.cursor = "pointer";

      document.getElementById("photo-lightbox").style.display = "none";

      if (name) openItemDetail(name, brand);

    row.addEventListener("mouseover", function() { row.style.background = "rgba(255,255,255,0.04)"; });

  const orderMap = {
    brand: ["ORTTU","MINOAR","RYVK","FRKM","YASAR","ARAHANT"],
    type:  ["Shirt","Top","Cardigan","Vest","Jacket","Coat","Pants","Trousers","Skirt","Skirt-Trouser","Robe","Boots"],
    color: null,
    style: ["Dark / Minimal","Tonal","Contrast","Night Out","—"],
  };

  const grouped = {};
  items.forEach(item => { const k = keyFn(item); if (!grouped[k]) grouped[k] = []; grouped[k].push(item); });
  let keys = (orderMap[sidebarSort] || []).filter(k => grouped[k]);
  Object.keys(grouped).forEach(k => { if (!keys.includes(k)) keys.push(k); });

  let html = "";
  keys.forEach(key => {
    const bk = bkey(key);
    const b = BRANDS[bk] || {};
    const displayKey = sidebarSort === "brand" ? (b.label || key) : key;
    html += "<div class='sidebar-section'><div class='sidebar-section-header'>" + displayKey + "</div>";
    (grouped[key] || []).forEach(item => {
      const ibk = bkey(item.brand);
      const ib = BRANDS[ibk] || { dot:"", label: item.brand };
      const img = IMAGES[item.name] || (item.img) || "";
      const itemPersona = getItemPersona(item);
      const itemPersonaLabel = itemPersona ? PERSONA_LABELS[itemPersona] : "";
      html += "<div class='wardrobe-item' data-name='" + item.name + "' data-brand='" + item.brand + "' draggable='true'>" +
        "<div class='item-thumb'>" + (img ? "<img src='" + img + "' alt='" + item.name + "' loading='lazy'>" : "<div class='item-thumb-empty'></div>") + "</div>" +
        "<div class='item-info'><div class='item-name'>" + item.name + "</div><div class='item-meta' style='display:flex;align-items:center;gap:5px;flex-wrap:wrap'>" + (item.color||"—") + " · " + (item.size||"—") + (itemPersonaLabel ? "<span style='background:var(--accent);color:#111;font-size:8px;padding:1px 5px;border-radius:4px;letter-spacing:0.06em;font-weight:600;text-transform:uppercase;white-space:nowrap'>" + itemPersonaLabel + "</span>" : "") + "</div></div>" +
        "<div class='item-dot " + ib.dot + "' style='margin-left:auto;flex-shrink:0'></div>" +
        "</div>";
    });
    html += "</div>";
  });
  el.innerHTML = html;

  el.querySelectorAll(".wardrobe-item").forEach(itemEl => {
    itemEl.addEventListener("click", () => showPreview(itemEl.dataset.name, itemEl.dataset.brand));
    itemEl.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", JSON.stringify({name: itemEl.dataset.name, brand: itemEl.dataset.brand})));
  });
}

function renderGrid() {
  const grid = document.getElementById("outfits-grid");
  // Proposed outfits live on the Proposals page until photographed — hide them here.
  const boardOutfits = outfits.filter(o => o.source !== "proposed");
  let filtered = boardOutfits;
  if (currentFilter !== "all") filtered = boardOutfits.filter(o => outfitFilterTags(o).has(currentFilter));
  if (currentPersonaFilter !== "all") filtered = filtered.filter(o => o.persona === currentPersonaFilter);
  // Apply stat filters
  const activeStats = Object.entries(statFilterVals).filter(([k,v]) => v > 0);
  if (activeStats.length) {
    filtered = filtered.filter(o => {
      const s = getOutfitStats(o);
      if (!s) return false;
      return activeStats.every(([k,v]) => (s[k]||0) >= v);
    });
  }

  // Always display outfits in ascending number (id) order
  filtered = [...filtered].sort((a, b) => a.id - b.id);

  document.getElementById("outfit-count-label").textContent = filtered.length + " Outfit" + (filtered.length !== 1 ? "s" : "");

  if (filtered.length === 0) {
    grid.innerHTML = "<div class='empty-card'>No outfits match this filter.</div>";
    return;
  }

  grid.classList.remove("horizontal", "card-view");
  if (outfitViewMode === "horizontal") {
    grid.classList.add("horizontal");
    grid.innerHTML = filtered.map(renderHorizontalCard).join("");
  } else if (outfitViewMode === "card") {
    grid.classList.add("card-view");
    grid.innerHTML = filtered.map(renderCardViewCard).join("");
    grid.querySelectorAll(".outfit-card.card-view").forEach(card => {
      card.addEventListener("click", () => openOutfitDetail(parseInt(card.dataset.id)));
    });
    return;
  }
  if (outfitViewMode === "horizontal") {
    // wire clicks for horizontal cards
    grid.querySelectorAll(".piece-name-link").forEach(el => {
      el.addEventListener("click", e => { e.stopPropagation(); openItemDetail(el.dataset.name, el.dataset.brand); });
    });
    grid.querySelectorAll(".outfit-card").forEach(card => {
      card.addEventListener("click", e => {
        if (e.target.closest(".piece-name-link")) return;
        openOutfitDetail(parseInt(card.dataset.id));
      });
    });
    return;
  }
  // Shared grid card builder (data.js). One source across Outfits + Today.
  grid.innerHTML = filtered.map(outfit =>
    outfitCardHtml(outfit, { view: "grid", photo: OUTFIT_PHOTOS[outfit.id] || PROPOSAL_PHOTO_PATHS[outfit.id] || "" })
  ).join("");

  grid.querySelectorAll(".piece-name-link").forEach(el => {
    el.addEventListener("click", e => { e.stopPropagation(); openItemDetail(el.dataset.name, el.dataset.brand); });
  });
  // Click anywhere on card → outfit detail
  grid.querySelectorAll(".outfit-card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".piece-name-link")) return;
      openOutfitDetail(parseInt(card.dataset.id));
    });
  });
}

function getOutfitStats(outfit) {
  // Effective stats (base + styling modifiers + combos). Engine lives in data.js.
  if (typeof effectiveOutfitStats === "function") return effectiveOutfitStats(outfit);
  const STAT_KEYS = ["drama","structure","skin","edge","formality"];
  const totals = {drama:0,structure:0,skin:0,edge:0,formality:0};
  let count = 0;
  outfit.pieces.forEach(p => {
    const item = itemForPiece(p);
    if (!item || !item.stats) return;
    STAT_KEYS.forEach(k => { totals[k] += item.stats[k]; });
    count++;
  });
  if (!count) return null;
  const avg = {};
  STAT_KEYS.forEach(k => { avg[k] = Math.round((totals[k]/count)*10)/10; });
  return avg;
}

function outfitStatPillsHtml(stats) {
  if (!stats) return "";
  const bars = ["drama","edge","structure","skin","formality"].map(k =>
    "<div style=\"display:flex;align-items:center;gap:5px;margin-bottom:3px\">" +
    "<div style=\"font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);width:54px\">" + k + "</div>" +
    "<div style=\"width:60px;height:2px;background:var(--border);border-radius:8px;overflow:hidden\"><div style=\"height:100%;width:" + (stats[k]||0)*20 + "%;background:var(--accent);border-radius:8px\"></div></div>" +
    "<div style=\"font-size:9px;color:var(--accent);width:14px\">" + (stats[k]||0) + "</div>" +
    "</div>"
  ).join("");
  return "<div style=\"display:flex;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--border)\">" +
    drawSpider(stats, 80, "#e2d3b4", "card") +
    "<div>" + bars + "</div>" +
  "</div>";
}

// ═══════════════════════════════════════════════════
// WORN HISTORY — render + log-a-wear detection flow
// ═══════════════════════════════════════════════════
function getEntryPhotos(w) {
  const outfit = w.outfitId != null ? outfits.find(o => o.id === w.outfitId) : null;
  const generated = outfit ? (OUTFIT_PHOTOS[outfit.id] || null) : null;
  const main = generated || w.photo || "";
  const attached = (generated && w.photo && generated !== w.photo) ? w.photo : null;
  return { main: main, attached: attached, outfit: outfit };
}


function openWearDetail(wornEntry) {
  const outfit = wornEntry.outfitId != null ? outfits.find(o => o.id === wornEntry.outfitId) : null;
  const photos = getEntryPhotos(wornEntry);
  const stats = outfit ? getOutfitStats(outfit) : null;

  // Left panel — generated photo with submitted overlay in corner
  const generatedPhoto = outfit ? (OUTFIT_PHOTOS[outfit.id] || PROPOSAL_PHOTO_PATHS[outfit.id] || null) : null;
  const submittedPhoto = wornEntry.photo || null;
  const photoEl = document.getElementById("wear-detail-photo");
  if (generatedPhoto) {
    const overlayHtml = submittedPhoto
      ? "<div style='position:absolute;bottom:16px;left:16px;width:22%;max-width:150px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,0.35);box-shadow:0 4px 16px rgba(0,0,0,0.7);z-index:5' class='wear-submitted-overlay'>" +
          "<img src='" + submittedPhoto + "' style='width:100%;height:100%;object-fit:cover;object-position:top center;display:block'>" +
          "<div style='position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.7);padding:3px 5px;text-align:center'>Worn</div>" +
        "</div>"
      : "";
    photoEl.innerHTML = "<div style='position:relative;width:100%;height:100%'>" +
      "<img src='" + generatedPhoto + "' alt='" + (outfit ? outfit.name : 'Outfit') + "' style='width:100%;height:100%;object-fit:cover;object-position:top center;display:block'>" +
      overlayHtml +
      "</div>";
  } else if (submittedPhoto) {
    photoEl.innerHTML = "<img src='" + submittedPhoto + "' alt='Submitted photo'>";
  } else {
    photoEl.innerHTML = "<div class='item-detail-photo-empty'><span>No photo</span></div>";
  }

  // Pieces
  const roleMap = {top:"Top",bottom:"Bottom",outer:"Outer",shoes:"Shoes",accessory:"Accessory"};
  const piecesHtml = wornEntry.itemIds.map(function(id) {
    const it = items.find(i => i.id === id);
    if (!it) return "";
    const img = IMAGES[it.name] || getImg(it.name) || "";
    return "<div class='lb-piece-row piece-name-link' data-name='" + it.name + "' data-brand='" + it.brand + "' style='cursor:pointer;border-radius:8px;padding:4px;transition:background 0.12s'>" +
      "<div class='lb-piece-thumb'>" + (img ? "<img src='" + img + "' alt='" + it.name + "'>" : "") + "</div>" +
      "<div class='lb-piece-info'>" +
        "<div class='lb-piece-role'>" + (roleMap[it.type] || "Piece") + "</div>" +
        "<div class='lb-piece-name'>" + it.name + "</div>" +
        "<div class='lb-piece-brand'>" + (BRANDS[bkey(it.brand)] && BRANDS[bkey(it.brand)].label || it.brand) + "</div>" +
      "</div></div>";
  }).join("");

  // Stats spider
  const statsHtml = outfit ? outfitStatsCompareHtml(outfit) : "";

  // Confidence placeholder
  const ratingHtml = wornEntry.confidence
    ? "<div style='margin-bottom:16px;padding:10px 14px;background:var(--surface2);border-radius:8px'>" +
        "<div style='font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px'>Confidence</div>" +
        "<div style='font-size:18px;color:var(--accent)'>" + "★".repeat(wornEntry.confidence) + "☆".repeat(5 - wornEntry.confidence) + "</div>" +
      "</div>"
    : "";

  document.getElementById("wear-detail-info").innerHTML =
    "<div class='item-detail-name'>" + fmtDate(wornEntry.date) + "</div>" +
    (outfit
      ? "<div style='display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;padding:8px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)' class='wear-outfit-link' data-outfit-id='" + outfit.id + "'>" +
          (generatedPhoto ? "<img src='" + generatedPhoto + "' style='width:44px;height:54px;object-fit:cover;object-position:top;border-radius:8px;flex-shrink:0'>" : "") +
          "<div>" +
            "<div style='font-size:11px;color:var(--text);font-weight:600'>" + outfit.name + "</div>" +
            "<div style='font-size:9px;color:var(--accent);font-style:italic'>" + (outfit.vibe||"") + "</div>" +
          "</div>" +
          "<div style='margin-left:auto;font-size:14px;color:var(--muted)'>&#x2192;</div>" +
        "</div>"
      : "<div style='font-size:12px;color:var(--muted);margin-bottom:12px'>Items Only</div>") +
    ratingHtml +
    statsHtml +
    "<div class='item-detail-section-title'>Pieces Worn</div>" +
    piecesHtml;

  // Wire outfit link click
  document.getElementById("wear-detail-info").querySelectorAll(".wear-outfit-link").forEach(function(el) {
    el.addEventListener("click", function() {
      closeWearDetail();
      openOutfitDetail(parseInt(el.dataset.outfitId));
    });
  });

  // Wire submitted overlay click
  const overlayEl = document.getElementById("wear-detail-photo").querySelector(".wear-submitted-overlay");
  if (overlayEl && submittedPhoto) {
    overlayEl.addEventListener("click", function() { openWearPhoto(submittedPhoto, "Submitted photo"); });
  }
  // Wire piece clicks
  document.getElementById("wear-detail-info").querySelectorAll(".piece-name-link").forEach(function(el) {
    el.addEventListener("click", function() {
      closeWearDetail();
      openItemDetail(el.dataset.name, el.dataset.brand);
    });
  });

  document.getElementById("wear-detail-overlay").style.display = "flex";
}

function closeWearDetail() {
  document.getElementById("wear-detail-overlay").style.display = "none";
}

});
